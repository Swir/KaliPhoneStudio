name: physical-first-test-session

on:
  pull_request:
    paths:
      - "main.py"
      - "kaliphonestudio/physical_first_test_session.py"
      - "kaliphonestudio/physical_fastboot_capture.py"
      - "devices/**/profile.json"
      - "tools/fastboot-tool-policy.json"
      - "tests/test_physical_first_test_session.py"
      - "tests/test_physical_fastboot_capture.py"
      - ".github/workflows/physical-first-test-session.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-test-session-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install pytest
      - name: Compile first-test session boundary
        run: >-
          python -m py_compile
          main.py
          kaliphonestudio/physical_first_test_session.py
          kaliphonestudio/physical_fastboot_capture.py
          tests/test_physical_first_test_session.py
          tests/test_physical_fastboot_capture.py
      - name: Run guarded first-test contracts
        run: >-
          python -m pytest -q
          tests/test_physical_first_test_session.py
          tests/test_physical_fastboot_capture.py
      - name: Assert wrapper has no direct device/write execution path
        shell: python
        run: |
          from pathlib import Path

          path = Path("kaliphonestudio/physical_first_test_session.py")
          text = path.read_text(encoding="utf-8")
          forbidden = (
              "import subprocess",
              "from subprocess",
              "import requests",
              "from requests",
              "fastboot boot",
              "fastboot flash",
              "fastboot erase",
              "set_active",
              "persistent_write_authorized=True",
              "phone_storage_written=True",
              "hardware_verified=True",
              "beta_gate_credit=True",
          )
          found = [needle for needle in forbidden if needle in text]
          if found:
              raise SystemExit(f"first-test session safety boundary violated: {found}")
          print("first-test session direct-write/device boundary: PASS")

  frozen-windows-first-test-session-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen-build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r build/windows-requirements.txt
      - name: Build frozen Windows host CLI
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Verify frozen first-test session command and fail-closed token gate
        shell: pwsh
        run: |
          $Cli = (Resolve-Path "dist/KaliPhoneStudioCLI/KaliPhoneStudioCLI.exe").Path

          & $Cli begin-physical-test-session --help | Set-Content -Encoding utf8 "dist/help-begin-physical-test-session.txt"
          if ($LASTEXITCODE -ne 0) { throw "Frozen first-test session help failed: $LASTEXITCODE" }

          $Help = (Get-Content -Raw "dist/help-begin-physical-test-session.txt").ToLowerInvariant()
          foreach ($Expected in @("--profile-id", "--serial", "--firmware-build", "--firmware-fingerprint", "--confirm-token", "--session-dir", "--fastboot")) {
            if (-not $Help.Contains($Expected)) { throw "Frozen first-test session help missing $Expected" }
          }

          & $Cli begin-physical-test-session `
            --profile-id oneplus/avicii `
            --serial "NEVER-CONNECTED" `
            --firmware-build "TEST" `
            --firmware-fingerprint "TEST" `
            --confirm-token "WRONG" `
            --fastboot "dist/missing-fastboot.exe" `
            --session-dir "dist/should-not-session" 2> "dist/refusal-first-test-session.txt"
          if ($LASTEXITCODE -ne 2) { throw "Frozen first-test session did not fail closed on wrong token: $LASTEXITCODE" }
          if (Test-Path "dist/should-not-session") { throw "Refused first-test session created a workspace" }

          $global:LASTEXITCODE = 0
          exit 0
