name: rootfs-handoff-trial-execution-gate

on:
  push:
    branches: [main]
    paths:
      - "kaliphonestudio/stable_file.py"
      - "kaliphonestudio/rootfs_handoff_fresh_revalidation.py"
      - "kaliphonestudio/rootfs_handoff_trial_plan.py"
      - "kaliphonestudio/rootfs_handoff_trial_preflight.py"
      - "kaliphonestudio/rootfs_handoff_trial_execution_gate.py"
      - "tests/test_rootfs_handoff_trial_execution_gate.py"
      - "tools/audit_rootfs_trial_chain.py"
      - "docs/ROOTFS_HANDOFF_TRIAL_EXECUTION_GATE.md"
      - ".github/workflows/rootfs-handoff-trial-execution-gate.yml"
  pull_request:
    paths:
      - "kaliphonestudio/stable_file.py"
      - "kaliphonestudio/rootfs_handoff_fresh_revalidation.py"
      - "kaliphonestudio/rootfs_handoff_trial_plan.py"
      - "kaliphonestudio/rootfs_handoff_trial_preflight.py"
      - "kaliphonestudio/rootfs_handoff_trial_execution_gate.py"
      - "tests/test_rootfs_handoff_trial_execution_gate.py"
      - "tools/audit_rootfs_trial_chain.py"
      - "docs/ROOTFS_HANDOFF_TRIAL_EXECUTION_GATE.md"
      - ".github/workflows/rootfs-handoff-trial-execution-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-gate-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install pytest
      - name: Compile exact execution-gate boundary
        run: >-
          python -m py_compile
          kaliphonestudio/stable_file.py
          kaliphonestudio/rootfs_handoff_fresh_revalidation.py
          kaliphonestudio/rootfs_handoff_trial_plan.py
          kaliphonestudio/rootfs_handoff_trial_preflight.py
          kaliphonestudio/rootfs_handoff_trial_execution_gate.py
          tools/audit_rootfs_trial_chain.py
      - name: Run fail-closed execution-gate tests and source audit
        run: >-
          python -m pytest -q tests/test_rootfs_handoff_trial_execution_gate.py
          && python tools/audit_rootfs_trial_chain.py --json
