name: profile-registry-audit

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "kaliphonestudio/profiles.py"
      - "kaliphonestudio/profile_registry_audit.py"
      - "devices/**/profile.json"
      - "tests/test_multi_device_core.py"
      - "tests/test_profile_registry_audit.py"
      - "docs/MULTI_DEVICE_PROFILE_REGISTRY.md"
      - ".github/workflows/profile-registry-audit.yml"
  pull_request:
    paths:
      - "main.py"
      - "kaliphonestudio/profiles.py"
      - "kaliphonestudio/profile_registry_audit.py"
      - "devices/**/profile.json"
      - "tests/test_multi_device_core.py"
      - "tests/test_profile_registry_audit.py"
      - "docs/MULTI_DEVICE_PROFILE_REGISTRY.md"
      - ".github/workflows/profile-registry-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Compile registry audit module
        run: python -m compileall -q kaliphonestudio/profile_registry_audit.py main.py
      - name: Audit bundled device registry
        run: PYTHONPATH=. python -m kaliphonestudio.profile_registry_audit --devices-root devices --json
      - name: Run registry and multi-device contract tests
        run: |
          python -m pip install pytest
          PYTHONPATH=. pytest -q tests/test_profile_registry_audit.py tests/test_multi_device_core.py
