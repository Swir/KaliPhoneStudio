name: rescue-readonly-diagnostics

on:
  push:
    paths:
      - "rescue/init"
      - "tools/rescue-payload-lock.json"
      - "kaliphonestudio/physical_boot_observation.py"
      - "kaliphonestudio/physical_rescue_diagnostics.py"
      - "kaliphonestudio/physical_rescue_functional_probes.py"
      - "scripts/record_physical_rescue_diagnostics.py"
      - "scripts/record_physical_rescue_functional_probes.py"
      - "tests/test_physical_boot_observation.py"
      - "tests/test_physical_rescue_diagnostics.py"
      - "tests/test_physical_rescue_functional_probes.py"
      - "tests/test_rescue_init_readonly_policy.py"
      - ".github/workflows/rescue-readonly-diagnostics.yml"
  pull_request:
    paths:
      - "rescue/init"
      - "tools/rescue-payload-lock.json"
      - "kaliphonestudio/physical_boot_observation.py"
      - "kaliphonestudio/physical_rescue_diagnostics.py"
      - "kaliphonestudio/physical_rescue_functional_probes.py"
      - "scripts/record_physical_rescue_diagnostics.py"
      - "scripts/record_physical_rescue_functional_probes.py"
      - "tests/test_physical_boot_observation.py"
      - "tests/test_physical_rescue_diagnostics.py"
      - "tests/test_physical_rescue_functional_probes.py"
      - "tests/test_rescue_init_readonly_policy.py"
      - ".github/workflows/rescue-readonly-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install pytest
      - name: Compile diagnostic sources
        run: >-
          python -m py_compile
          kaliphonestudio/physical_rescue_diagnostics.py
          kaliphonestudio/physical_rescue_functional_probes.py
          scripts/record_physical_rescue_diagnostics.py
          scripts/record_physical_rescue_functional_probes.py
      - name: Validate rescue init shell syntax
        run: sh -n rescue/init
      - name: Run focused read-only rescue diagnostic contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_physical_boot_observation.py
          tests/test_physical_rescue_diagnostics.py
          tests/test_physical_rescue_functional_probes.py
          tests/test_rescue_init_readonly_policy.py
