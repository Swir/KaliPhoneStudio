name: kali-early-userspace-proof

on:
  push:
    branches: [main]
    paths:
      - "kaliphonestudio/kali_early_userspace.py"
      - "kaliphonestudio/physical_kali_early_userspace.py"
      - "tests/test_kali_early_userspace.py"
      - "docs/KALI_EARLY_USERSPACE_PROOF.md"
      - ".github/workflows/kali-early-userspace-proof.yml"
  pull_request:
    paths:
      - "kaliphonestudio/kali_early_userspace.py"
      - "kaliphonestudio/physical_kali_early_userspace.py"
      - "tests/test_kali_early_userspace.py"
      - "docs/KALI_EARLY_USERSPACE_PROOF.md"
      - ".github/workflows/kali-early-userspace-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Compile proof modules
        run: >-
          python -m py_compile
          kaliphonestudio/kali_early_userspace.py
          kaliphonestudio/physical_kali_early_userspace.py
      - name: Run focused early-userspace proof contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_kali_early_userspace.py
