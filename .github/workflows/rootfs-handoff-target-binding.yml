name: rootfs-handoff-target-binding

on:
  push:
    branches: [main]
    paths:
      - "kaliphonestudio/stable_file.py"
      - "kaliphonestudio/rootfs_handoff_target_binding.py"
      - "kaliphonestudio/operator_strategy_evidence_cli.py"
      - "scripts/build_rootfs_handoff_target_binding.py"
      - "tests/test_stable_file.py"
      - "tests/test_rootfs_trial_stable_evidence_reads.py"
      - "tests/test_rootfs_handoff_target_binding.py"
      - "tests/test_operator_strategy_evidence_cli.py"
      - "docs/ROOTFS_HANDOFF_TARGET_BINDING.md"
      - "README.md"
      - "ROADMAP.md"
      - "BUILD_STATUS.json"
      - "BETA_RELEASE_GATE.md"
      - "CHANGELOG.md"
      - ".github/workflows/rootfs-handoff-target-binding.yml"
  pull_request:
    paths:
      - "kaliphonestudio/stable_file.py"
      - "kaliphonestudio/rootfs_handoff_target_binding.py"
      - "kaliphonestudio/operator_strategy_evidence_cli.py"
      - "scripts/build_rootfs_handoff_target_binding.py"
      - "tests/test_stable_file.py"
      - "tests/test_rootfs_trial_stable_evidence_reads.py"
      - "tests/test_rootfs_handoff_target_binding.py"
      - "tests/test_operator_strategy_evidence_cli.py"
      - "docs/ROOTFS_HANDOFF_TARGET_BINDING.md"
      - "README.md"
      - "ROADMAP.md"
      - "BUILD_STATUS.json"
      - "BETA_RELEASE_GATE.md"
      - "CHANGELOG.md"
      - ".github/workflows/rootfs-handoff-target-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Compile target-binding and exact-file boundary
        run: >-
          python -m py_compile
          kaliphonestudio/stable_file.py
          kaliphonestudio/rootfs_handoff_target_binding.py
          kaliphonestudio/operator_strategy_evidence_cli.py
          scripts/build_rootfs_handoff_target_binding.py
          tests/test_rootfs_trial_stable_evidence_reads.py
          tests/test_rootfs_handoff_target_binding.py
          tests/test_operator_strategy_evidence_cli.py
      - name: Run target-binding fail-closed, stable-file and shared workspace tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_stable_file.py
          tests/test_rootfs_trial_stable_evidence_reads.py
          tests/test_rootfs_handoff_target_binding.py
          tests/test_operator_strategy_evidence_cli.py
      - name: Re-run core progress and repository presentation contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_progress_svgs.py
          tests/test_progress_presentation_policy.py
          tests/test_repository_contract.py
