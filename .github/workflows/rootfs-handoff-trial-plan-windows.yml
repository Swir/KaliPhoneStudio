name: rootfs-handoff-trial-plan-windows

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "kaliphonestudio/operator_evidence_workspace.py"
      - "kaliphonestudio/operator_trial_evidence_cli.py"
      - "kaliphonestudio/rootfs_handoff_trial_authorization.py"
      - "kaliphonestudio/rootfs_handoff_trial_plan.py"
      - "kaliphonestudio/rootfs_handoff_fresh_revalidation.py"
      - "kaliphonestudio/rootfs_handoff_target_binding.py"
      - "scripts/build_windows.ps1"
      - "build/windows-requirements.txt"
      - "requirements.txt"
      - "tests/test_rootfs_handoff_trial_authorization.py"
      - "tests/test_rootfs_handoff_trial_plan.py"
      - "tests/test_operator_trial_evidence_workspace.py"
      - ".github/workflows/rootfs-handoff-trial-plan-windows.yml"
  pull_request:
    paths:
      - "main.py"
      - "kaliphonestudio/operator_evidence_workspace.py"
      - "kaliphonestudio/operator_trial_evidence_cli.py"
      - "kaliphonestudio/rootfs_handoff_trial_authorization.py"
      - "kaliphonestudio/rootfs_handoff_trial_plan.py"
      - "kaliphonestudio/rootfs_handoff_fresh_revalidation.py"
      - "kaliphonestudio/rootfs_handoff_target_binding.py"
      - "scripts/build_windows.ps1"
      - "build/windows-requirements.txt"
      - "requirements.txt"
      - "tests/test_rootfs_handoff_trial_authorization.py"
      - "tests/test_rootfs_handoff_trial_plan.py"
      - "tests/test_operator_trial_evidence_workspace.py"
      - ".github/workflows/rootfs-handoff-trial-plan-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-trial-plan-safety:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime and pinned Windows build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r build/windows-requirements.txt
          python -m pip install pytest

      - name: Verify source trial contracts before freezing
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_rootfs_handoff_trial_authorization.py
          tests/test_rootfs_handoff_trial_plan.py
          tests/test_operator_trial_evidence_workspace.py

      - name: Build frozen Windows host CLI
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Smoke-test frozen trial-plan command and fail-closed refusal
        shell: pwsh
        run: |
          $Cli = (Resolve-Path "dist/KaliPhoneStudioCLI/KaliPhoneStudioCLI.exe").Path

          & $Cli evidence --help | Set-Content -Encoding utf8 "dist/trial-root-help.txt"
          if ($LASTEXITCODE -ne 0) { throw "Frozen evidence help failed: $LASTEXITCODE" }

          & $Cli evidence build-rootfs-handoff-trial-plan --help | Set-Content -Encoding utf8 "dist/trial-plan-help.txt"
          if ($LASTEXITCODE -ne 0) { throw "Frozen trial-plan help failed: $LASTEXITCODE" }

          & $Cli evidence build-rootfs-handoff-trial-plan `
            --trial-authorization "dist/missing-authorization.json" `
            --target-binding "dist/missing-target-binding.json" `
            --fresh-revalidation "dist/missing-fresh-revalidation.json" `
            --out "dist/should-not-trial-plan.json" 2> "dist/trial-plan-refusal.txt"
          if ($LASTEXITCODE -ne 2) { throw "Frozen trial-plan command did not fail closed: $LASTEXITCODE" }
          if (Test-Path "dist/should-not-trial-plan.json") { throw "Refused frozen trial-plan command created output" }

          & $Cli evidence --json build-rootfs-handoff-trial-plan `
            --trial-authorization "dist/missing-authorization-json.json" `
            --target-binding "dist/missing-target-binding-json.json" `
            --fresh-revalidation "dist/missing-fresh-revalidation-json.json" `
            --out "dist/should-not-trial-plan-json.json" 2> "dist/trial-plan-json-refusal.txt"
          if ($LASTEXITCODE -ne 2) { throw "Frozen --json trial-plan command did not fail closed: $LASTEXITCODE" }
          if (Test-Path "dist/should-not-trial-plan-json.json") { throw "Refused frozen --json trial-plan command created output" }

          @'
          from pathlib import Path

          def text(name):
              raw = Path("dist", name).read_text(encoding="utf-8-sig").lower()
              return " ".join(raw.split())

          root = text("trial-root-help.txt")
          assert "build-rootfs-handoff-trial-plan" in root
          assert "offline exact-file evidence workspace" in root
          assert "do not connect to a phone" in root
          assert "do not run adb/fastboot" in root
          assert "no hardware/beta credit" in root

          plan = text("trial-plan-help.txt")
          assert "non-executing plan" in plan
          assert "--trial-authorization" in plan
          assert "--target-binding" in plan
          assert "--fresh-revalidation" in plan
          assert "--out" in plan
          assert "no device i/o" in plan
          assert "raw device path" in plan
          assert "explicit operator confirmation" in plan

          assert "evidence workflow error" in text("trial-plan-refusal.txt")
          assert "evidence workflow error" in text("trial-plan-json-refusal.txt")
          '@ | python -
