name: physical-hardware-test-plan

on:
  push:
    branches: [main]
    paths:
      - "devices/**/profile.json"
      - "kaliphonestudio/functional_hardware_contract.py"
      - "kaliphonestudio/physical_hardware_test_plan.py"
      - "kaliphonestudio/physical_hardware_review.py"
      - "scripts/build_physical_hardware_test_plan.py"
      - "tests/test_functional_hardware_contract.py"
      - "tests/test_physical_hardware_test_plan.py"
      - ".github/workflows/physical-hardware-test-plan.yml"
  pull_request:
    paths:
      - "devices/**/profile.json"
      - "kaliphonestudio/functional_hardware_contract.py"
      - "kaliphonestudio/physical_hardware_test_plan.py"
      - "kaliphonestudio/physical_hardware_review.py"
      - "scripts/build_physical_hardware_test_plan.py"
      - "tests/test_functional_hardware_contract.py"
      - "tests/test_physical_hardware_test_plan.py"
      - ".github/workflows/physical-hardware-test-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest
      - name: Compile functional hardware planning sources
        run: >-
          python -m py_compile
          kaliphonestudio/functional_hardware_contract.py
          kaliphonestudio/physical_hardware_test_plan.py
          scripts/build_physical_hardware_test_plan.py
          tests/test_functional_hardware_contract.py
          tests/test_physical_hardware_test_plan.py
      - name: Run fail-closed functional hardware planning tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_functional_hardware_contract.py tests/test_physical_hardware_test_plan.py
