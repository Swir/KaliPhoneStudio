name: windows-host-build

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "kaliphonestudio/app.py"
      - "kaliphonestudio/operator_diagnostics.py"
      - "kaliphonestudio/physical_fastboot_capture.py"
      - "kaliphonestudio/fastboot_capture.py"
      - "kaliphonestudio/fastboot_baseline.py"
      - "kaliphonestudio/fastboot_tool.py"
      - "kaliphonestudio/fastboot_capture_bundle.py"
      - "kaliphonestudio/stock_baseline_ingress.py"
      - "kaliphonestudio/physical_candidate_operator.py"
      - "kaliphonestudio/physical_candidate_gate.py"
      - "kaliphonestudio/temporary_boot_offer.py"
      - "kaliphonestudio/temporary_boot_execution.py"
      - "kaliphonestudio/ota_import.py"
      - "kaliphonestudio/payload.py"
      - "kaliphonestudio/boot_image.py"
      - "kaliphonestudio/provenance.py"
      - "kaliphonestudio/physical_baseline_bundle.py"
      - "devices/**/profile.json"
      - "assets/**"
      - "tools/**"
      - "BUILD_STATUS.json"
      - "BETA_RELEASE_GATE.md"
      - "requirements.txt"
      - "build/windows-requirements.txt"
      - "scripts/build_windows.ps1"
      - "scripts/bind_physical_candidate_gate.py"
      - "scripts/prepare_temporary_boot_offer.py"
      - "scripts/execute_temporary_boot_once.py"
      - "tests/test_windows_packaging_contract.py"
      - "tests/test_physical_fastboot_capture.py"
      - "tests/test_stock_baseline_ingress.py"
      - "tests/test_physical_candidate_operator.py"
      - "tests/test_physical_candidate_gate.py"
      - "tests/test_temporary_boot_offer.py"
      - "tests/test_temporary_boot_execution.py"
      - "docs/WINDOWS_HOST_BUILD.md"
      - "docs/PHYSICAL_FASTBOOT_OPERATOR_CAPTURE.md"
      - "docs/STOCK_BASELINE_INGRESS.md"
      - "docs/PHYSICAL_CANDIDATE_OPERATOR.md"
      - ".github/workflows/windows-host-build.yml"
  pull_request:
    paths:
      - "main.py"
      - "kaliphonestudio/app.py"
      - "kaliphonestudio/operator_diagnostics.py"
      - "kaliphonestudio/physical_fastboot_capture.py"
      - "kaliphonestudio/fastboot_capture.py"
      - "kaliphonestudio/fastboot_baseline.py"
      - "kaliphonestudio/fastboot_tool.py"
      - "kaliphonestudio/fastboot_capture_bundle.py"
      - "kaliphonestudio/stock_baseline_ingress.py"
      - "kaliphonestudio/physical_candidate_operator.py"
      - "kaliphonestudio/physical_candidate_gate.py"
      - "kaliphonestudio/temporary_boot_offer.py"
      - "kaliphonestudio/temporary_boot_execution.py"
      - "kaliphonestudio/ota_import.py"
      - "kaliphonestudio/payload.py"
      - "kaliphonestudio/boot_image.py"
      - "kaliphonestudio/provenance.py"
      - "kaliphonestudio/physical_baseline_bundle.py"
      - "devices/**/profile.json"
      - "assets/**"
      - "tools/**"
      - "BUILD_STATUS.json"
      - "BETA_RELEASE_GATE.md"
      - "requirements.txt"
      - "build/windows-requirements.txt"
      - "scripts/build_windows.ps1"
      - "scripts/bind_physical_candidate_gate.py"
      - "scripts/prepare_temporary_boot_offer.py"
      - "scripts/execute_temporary_boot_once.py"
      - "tests/test_windows_packaging_contract.py"
      - "tests/test_physical_fastboot_capture.py"
      - "tests/test_stock_baseline_ingress.py"
      - "tests/test_physical_candidate_operator.py"
      - "tests/test_physical_candidate_gate.py"
      - "tests/test_temporary_boot_offer.py"
      - "tests/test_temporary_boot_execution.py"
      - "docs/WINDOWS_HOST_BUILD.md"
      - "docs/PHYSICAL_FASTBOOT_OPERATOR_CAPTURE.md"
      - "docs/STOCK_BASELINE_INGRESS.md"
      - "docs/PHYSICAL_CANDIDATE_OPERATOR.md"
      - ".github/workflows/windows-host-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-host-package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime and pinned Windows build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r build/windows-requirements.txt
          python -m pip install pytest
          python -m PyInstaller --version

      - name: Verify packaging and operator safety contracts before freezing
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_windows_packaging_contract.py
          tests/test_operator_diagnostics.py
          tests/test_app.py
          tests/test_physical_fastboot_capture.py
          tests/test_stock_baseline_ingress.py
          tests/test_physical_candidate_operator.py
          tests/test_physical_candidate_gate.py
          tests/test_temporary_boot_offer.py
          tests/test_temporary_boot_execution.py

      - name: Build GUI and CLI onedir artifacts
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Smoke-test frozen CLI safety surface
        shell: pwsh
        run: |
          $Cli = (Resolve-Path "dist/KaliPhoneStudioCLI/KaliPhoneStudioCLI.exe").Path
          & $Cli --list-profiles --json | Set-Content -Encoding utf8 "dist/profiles.json"
          if ($LASTEXITCODE -ne 0) { throw "Frozen --list-profiles failed: $LASTEXITCODE" }
          & $Cli --doctor --profile-id oneplus/avicii --json | Set-Content -Encoding utf8 "dist/doctor.json"
          if ($LASTEXITCODE -ne 0) { throw "Frozen --doctor failed: $LASTEXITCODE" }
          & $Cli --recovery-guide --profile-id oneplus/avicii --json | Set-Content -Encoding utf8 "dist/recovery.json"
          if ($LASTEXITCODE -ne 0) { throw "Frozen --recovery-guide failed: $LASTEXITCODE" }
          & $Cli --export-diagnostics "dist/operator-diagnostics.json" --profile-id oneplus/avicii --json | Set-Content -Encoding utf8 "dist/export-result.json"
          if ($LASTEXITCODE -ne 0) { throw "Frozen --export-diagnostics failed: $LASTEXITCODE" }

          & $Cli capture-fastboot-baseline --help | Set-Content -Encoding utf8 "dist/capture-help.txt"
          if ($LASTEXITCODE -ne 0) { throw "Frozen physical capture help failed: $LASTEXITCODE" }
          & $Cli prepare-stock-provenance --help | Set-Content -Encoding utf8 "dist/stock-provenance-help.txt"
          if ($LASTEXITCODE -ne 0) { throw "Frozen stock provenance help failed: $LASTEXITCODE" }
          & $Cli bind-physical-stock-baseline --help | Set-Content -Encoding utf8 "dist/stock-bind-help.txt"
          if ($LASTEXITCODE -ne 0) { throw "Frozen stock baseline bind help failed: $LASTEXITCODE" }
          & $Cli bind-physical-candidate-gate --help | Set-Content -Encoding utf8 "dist/candidate-bind-help.txt"
          if ($LASTEXITCODE -ne 0) { throw "Frozen candidate bind help failed: $LASTEXITCODE" }
          & $Cli prepare-temporary-boot-offer --help | Set-Content -Encoding utf8 "dist/temporary-offer-help.txt"
          if ($LASTEXITCODE -ne 0) { throw "Frozen temporary offer help failed: $LASTEXITCODE" }
          & $Cli execute-temporary-boot-once --help | Set-Content -Encoding utf8 "dist/temporary-execution-help.txt"
          if ($LASTEXITCODE -ne 0) { throw "Frozen temporary execution help failed: $LASTEXITCODE" }

          # Fail before any Fastboot/tool/device interaction when explicit profile
          # confirmation is absent. Exit code 2 is the expected argparse refusal.
          & $Cli capture-fastboot-baseline --profile-id oneplus/avicii --serial NEVER-CONNECTED --firmware-build TEST --firmware-fingerprint TEST --output-dir "dist/should-not-exist" 2> "dist/capture-refusal.txt"
          if ($LASTEXITCODE -ne 2) { throw "Frozen capture did not fail closed without confirmation token: $LASTEXITCODE" }
          if (Test-Path "dist/should-not-exist") { throw "Refused frozen capture created an output directory" }

          # Offline stock/candidate/offer commands must fail closed on missing evidence
          # and must never create output records in that case.
          & $Cli prepare-stock-provenance --profile-id oneplus/avicii --ota "dist/missing-ota.zip" --payload "dist/missing-payload.bin" --stock-boot "dist/missing-boot.img" --out "dist/should-not-stock.json" 2> "dist/stock-refusal.txt"
          if ($LASTEXITCODE -ne 2) { throw "Frozen stock provenance did not fail closed: $LASTEXITCODE" }
          if (Test-Path "dist/should-not-stock.json") { throw "Refused stock provenance created output" }
          & $Cli bind-physical-stock-baseline --profile-id oneplus/avicii --baseline-evidence "dist/missing-baseline.json" --capture-evidence "dist/missing-capture.json" --stock-provenance "dist/missing-stock.json" --out "dist/should-not-bind.json" 2> "dist/bind-refusal.txt"
          if ($LASTEXITCODE -ne 2) { throw "Frozen stock bind did not fail closed: $LASTEXITCODE" }
          if (Test-Path "dist/should-not-bind.json") { throw "Refused stock bind created output" }
          & $Cli bind-physical-candidate-gate --profile-id oneplus/avicii --physical-baseline "dist/missing-physical.json" --first-boot-manifest "dist/missing-manifest.json" --authority-bundle "dist/missing-authority.json" --boot-authorization "dist/missing-authorization.json" --boot-plan "dist/missing-plan.json" --out "dist/should-not-candidate.json" 2> "dist/candidate-refusal.txt"
          if ($LASTEXITCODE -ne 2) { throw "Frozen candidate bind did not fail closed: $LASTEXITCODE" }
          if (Test-Path "dist/should-not-candidate.json") { throw "Refused candidate bind created output" }
          & $Cli prepare-temporary-boot-offer --profile-id oneplus/avicii --physical-candidate-gate "dist/missing-gate.json" --capture-bundle "dist/missing-capture.json" --fastboot-tool-evidence "dist/missing-tool.json" --fastboot-executable "dist/missing-fastboot.exe" --boot-image "dist/missing-boot.img" --out "dist/should-not-offer.json" 2> "dist/offer-refusal.txt"
          if ($LASTEXITCODE -ne 2) { throw "Frozen temporary offer did not fail closed: $LASTEXITCODE" }
          if (Test-Path "dist/should-not-offer.json") { throw "Refused temporary offer created output" }

          # The only command that could invoke `fastboot boot` must refuse before
          # evidence loading or device probing unless the explicit execution opt-in
          # is present, even when every other required argument is supplied.
          & $Cli execute-temporary-boot-once --profile-id oneplus/avicii --physical-candidate-gate "dist/missing-gate.json" --capture-bundle "dist/missing-capture.json" --baseline-evidence "dist/missing-baseline.json" --fastboot-tool-evidence "dist/missing-tool.json" --fastboot-executable "dist/missing-fastboot.exe" --boot-image "dist/missing-boot.img" --confirmation "WRONG-ON-PURPOSE" --probe-out "dist/should-not-probe.json" --execution-out "dist/should-not-execute.json" 2> "dist/execution-refusal.txt"
          if ($LASTEXITCODE -ne 2) { throw "Frozen temporary execution did not fail closed without opt-in: $LASTEXITCODE" }
          if (Test-Path "dist/should-not-probe.json") { throw "Refused temporary execution created probe evidence" }
          if (Test-Path "dist/should-not-execute.json") { throw "Refused temporary execution created execution evidence" }

          @'
          import json
          from pathlib import Path

          def load(name):
              return json.loads(Path("dist", name).read_text(encoding="utf-8-sig"))

          def text(name):
              # argparse wraps help according to the console width. Normalize
              # whitespace so safety assertions verify words/meaning rather than
              # a platform-specific line break.
              raw = Path("dist", name).read_text(encoding="utf-8-sig").lower()
              return " ".join(raw.split())

          profiles = load("profiles.json")
          assert any(item["profile_id"] == "oneplus/avicii" for item in profiles)
          doctor = load("doctor.json")
          assert doctor["selected_profile_id"] == "oneplus/avicii"
          assert doctor["physical_interaction_performed"] is False
          assert doctor["hardware_verified"] is False
          assert doctor["beta_gate_credit"] is False
          recovery = load("recovery.json")
          assert recovery["persistent_write_authorized"] is False
          assert recovery["hardware_verified"] is False
          assert recovery["beta_gate_credit"] is False
          bundle = load("operator-diagnostics.json")
          assert bundle["privacy"]["external_commands_executed"] is False
          assert bundle["privacy"]["device_queried"] is False
          assert bundle["privacy"]["absolute_tool_paths_exported"] is False
          assert bundle["hardware_verified"] is False
          assert bundle["beta_gate_credit"] is False

          capture_help = text("capture-help.txt")
          assert "read-only" in capture_help
          assert "--confirm-token" in capture_help
          stock_help = text("stock-provenance-help.txt")
          assert "offline" in stock_help
          assert "--ota" in stock_help
          assert "--payload" in stock_help
          bind_help = text("stock-bind-help.txt")
          assert "offline" in bind_help
          assert "--baseline-evidence" in bind_help
          candidate_help = text("candidate-bind-help.txt")
          assert "offline" in candidate_help
          assert "--physical-baseline" in candidate_help
          offer_help = text("temporary-offer-help.txt")
          assert "offline" in offer_help
          assert "not authorize execution" in offer_help
          execution_help = text("temporary-execution-help.txt")
          assert "--execute-temporary-boot" in execution_help
          assert "no persistent write verb" in execution_help
          refusal = text("capture-refusal.txt")
          assert "--confirm-token" in refusal
          execution_refusal = text("execution-refusal.txt")
          assert "--execute-temporary-boot" in execution_refusal
          '@ | python -

      - name: Smoke-test frozen GUI bootstrap path
        shell: pwsh
        run: |
          $Gui = (Resolve-Path "dist/KaliPhoneStudio/KaliPhoneStudio.exe").Path
          $Process = Start-Process -FilePath $Gui -ArgumentList "--version" -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Frozen GUI bootstrap/version path failed: $($Process.ExitCode)" }

      - name: Create per-run SHA-256 manifest
        shell: pwsh
        run: |
          $Root = (Resolve-Path "dist").Path
          $Targets = @(
            (Resolve-Path "dist/KaliPhoneStudio").Path,
            (Resolve-Path "dist/KaliPhoneStudioCLI").Path
          )
          $Lines = foreach ($Target in $Targets) {
            Get-ChildItem -Path $Target -Recurse -File |
              Sort-Object FullName |
              ForEach-Object {
                $Hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
                $Relative = [IO.Path]::GetRelativePath($Root, $_.FullName).Replace('\\', '/')
                "$Hash  $Relative"
              }
          }
          $Lines | Set-Content -Encoding ascii "dist/WINDOWS_HOST_BUILD_SHA256.txt"
          @{
            schema_version = 1
            kind = "kaliphonestudio-unsigned-windows-host-development-build"
            git_commit = "${{ github.sha }}"
            python = "3.12"
            pyinstaller = "6.22.3"
            pyinstaller_hooks_contrib = "2026.7"
            packaging_mode = "onedir"
            signed = $false
            hardware_verified = $false
            beta_release = $false
            beta_gate_credit = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8 "dist/WINDOWS_HOST_BUILD_INFO.json"

      - name: Upload unsigned development host artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaliPhoneStudio-windows-host-dev-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/KaliPhoneStudio/**
            dist/KaliPhoneStudioCLI/**
            dist/WINDOWS_HOST_BUILD_SHA256.txt
            dist/WINDOWS_HOST_BUILD_INFO.json
