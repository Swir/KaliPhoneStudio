name: automation-fix-current-observation-failfast
on:
  push:
    branches: [automation/current-observation-downstream-gates]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: automation/current-observation-downstream-gates
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply fail-closed ordering repair
        shell: python
        run: |
          from pathlib import Path
          patches = {
              Path('kaliphonestudio/physical_hardware_test_observation.py'): (
                  "    try:\n        require_current_physical_campaign_observation(\n            observation,\n            expected_profile_id=plan.profile_id,\n",
                  "    try:\n        # Reject stale/legacy provenance before dereferencing downstream evidence.\n        require_current_physical_campaign_observation(observation)\n        require_current_physical_campaign_observation(\n            observation,\n            expected_profile_id=plan.profile_id,\n",
              ),
              Path('kaliphonestudio/physical_hardware_test_review.py'): (
                  "    try:\n        require_current_physical_campaign_observation(\n            boot_observation,\n            expected_profile_id=observation.profile_id,\n",
                  "    try:\n        # Reject stale/legacy provenance before dereferencing downstream evidence.\n        require_current_physical_campaign_observation(boot_observation)\n        require_current_physical_campaign_observation(\n            boot_observation,\n            expected_profile_id=observation.profile_id,\n",
              ),
          }
          for path, (old, new) in patches.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: patch anchor mismatch')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Verify focused fail-closed tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_current_physical_observation_downstream_gate.py tests/test_current_physical_observation_rescue_gate.py
          python -m compileall -q kaliphonestudio
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaliphonestudio/physical_hardware_test_observation.py kaliphonestudio/physical_hardware_test_review.py
          git diff --cached --check
          git commit -m "Fix fail-closed current observation ordering"
          git push origin HEAD:automation/current-observation-downstream-gates
