name: windows-operator-extractor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-operator-extractor.yml"
      - "scripts/build_windows_operator_extractor.ps1"
      - "tools/extractor-locks.json"
      - "tests/test_windows_operator_extractor_contract.py"
      - "docs/WINDOWS_OPERATOR_EXTRACTOR.md"
  pull_request:
    paths:
      - ".github/workflows/windows-operator-extractor.yml"
      - "scripts/build_windows_operator_extractor.ps1"
      - "tools/extractor-locks.json"
      - "tests/test_windows_operator_extractor_contract.py"
      - "docs/WINDOWS_OPERATOR_EXTRACTOR.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install contract test dependency
        run: python -m pip install pytest
      - name: Run operator extractor contract tests
        run: python -m pytest -q tests/test_windows_operator_extractor_contract.py

  build-exact-windows-extractor:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
          cache: false

      - name: Build exact source-locked payload extractor
        shell: pwsh
        run: ./scripts/build_windows_operator_extractor.ps1 -OutputDir "dist/operator-tools"

      - name: Verify exact artifact and non-authorizing manifest
        shell: pwsh
        run: |
          $Lock = Get-Content -Raw -Encoding UTF8 "tools/extractor-locks.json" | ConvertFrom-Json
          $Manifest = Get-Content -Raw -Encoding UTF8 "dist/operator-tools/operator-extractor-manifest.json" | ConvertFrom-Json
          $Exe = "dist/operator-tools/payload-dumper-go.exe"
          $License = "dist/operator-tools/payload-dumper-go-LICENSE.txt"

          if (-not (Test-Path $Exe -PathType Leaf)) { throw "Extractor executable missing" }
          if (-not (Test-Path $License -PathType Leaf)) { throw "Apache-2.0 license copy missing" }

          $Actual = (Get-FileHash -Algorithm SHA256 -Path $Exe).Hash.ToLowerInvariant()
          $Expected = ([string]$Lock.artifacts.'windows-amd64'.sha256).ToLowerInvariant()
          if ($Actual -ne $Expected) { throw "Final extractor SHA-256 drift: $Actual" }
          if ($Manifest.source_commit -ne $Lock.source.commit) { throw "Manifest source commit drift" }
          if ($Manifest.go_toolchain_version -ne $Lock.build.toolchain_version) { throw "Manifest Go lock drift" }
          if ($Manifest.executable_sha256 -ne $Expected) { throw "Manifest executable hash drift" }
          if ($Manifest.source_lock_verified -ne $true) { throw "Source lock was not verified" }
          if ($Manifest.executable_hash_verified -ne $true) { throw "Executable hash was not verified" }

          foreach ($Field in @(
            "physical_interaction_performed",
            "external_device_command_executed",
            "persistent_write_authorized",
            "phone_storage_written",
            "hardware_verified",
            "beta_release_authorized",
            "beta_gate_credit"
          )) {
            if ($Manifest.$Field -ne $false) { throw "Unsafe manifest field: $Field" }
          }

          $Actual | Set-Content -Encoding ascii "dist/operator-tools/payload-dumper-go.exe.sha256"

      - name: Upload exact non-release operator tool
        uses: actions/upload-artifact@v4
        with:
          name: KaliPhoneStudio-windows-operator-extractor-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/operator-tools/
          if-no-files-found: error
          retention-days: 7
