name: windows-operator-extractor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-operator-extractor.yml"
      - "scripts/build_windows_operator_extractor.ps1"
      - "scripts/stage_windows_extractor_runtime.ps1"
      - "tools/extractor-locks.json"
      - "tests/test_windows_operator_extractor_contract.py"
      - "tests/test_extractor.py"
      - "tests/test_tool_locks.py"
      - "docs/WINDOWS_OPERATOR_EXTRACTOR.md"
  pull_request:
    paths:
      - ".github/workflows/windows-operator-extractor.yml"
      - "scripts/build_windows_operator_extractor.ps1"
      - "scripts/stage_windows_extractor_runtime.ps1"
      - "tools/extractor-locks.json"
      - "tests/test_windows_operator_extractor_contract.py"
      - "tests/test_extractor.py"
      - "tests/test_tool_locks.py"
      - "docs/WINDOWS_OPERATOR_EXTRACTOR.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install contract test dependency
        run: python -m pip install pytest
      - name: Run operator extractor and lock contract tests
        run: >-
          python -m pytest -q
          tests/test_windows_operator_extractor_contract.py
          tests/test_extractor.py
          tests/test_tool_locks.py

  build-exact-windows-extractor:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
          cache: false

      - name: Install reviewed Windows CGO and liblzma prerequisites
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-xz'
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 extractor prerequisites failed: $LASTEXITCODE" }
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CC=C:\msys64\mingw64\bin\gcc.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CXX=C:\msys64\mingw64\bin\g++.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_ENABLED=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_CFLAGS=-IC:/msys64/mingw64/include' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_LDFLAGS=-LC:/msys64/mingw64/lib' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify reviewed native toolchain visibility
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\msys64\mingw64\include\lzma.h')) { throw 'lzma.h is not installed' }
          if (-not (Test-Path 'C:\msys64\mingw64\bin\objdump.exe')) { throw 'objdump.exe is not installed' }
          & $env:CC --version
          if ($LASTEXITCODE -ne 0) { throw 'MinGW GCC is not executable' }
          & go version
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Go toolchain is not executable' }

      - name: Build exact source-locked payload extractor bundle
        shell: pwsh
        run: ./scripts/build_windows_operator_extractor.ps1 -OutputDir "dist/operator-tools"

      - name: Verify exact artifact, runtime closure and non-authorizing manifest
        shell: pwsh
        run: |
          $Lock = Get-Content -Raw -Encoding UTF8 "tools/extractor-locks.json" | ConvertFrom-Json
          $Manifest = Get-Content -Raw -Encoding UTF8 "dist/operator-tools/operator-extractor-manifest.json" | ConvertFrom-Json
          $Runtime = Get-Content -Raw -Encoding UTF8 "dist/operator-tools/operator-extractor-runtime.json" | ConvertFrom-Json
          $Exe = "dist/operator-tools/payload-dumper-go.exe"
          $License = "dist/operator-tools/payload-dumper-go-LICENSE.txt"
          $Help = "dist/operator-tools/payload-dumper-go-help.txt"

          foreach ($Path in @($Exe, $License, $Help, "dist/operator-tools/operator-extractor-runtime.json")) {
            if (-not (Test-Path $Path -PathType Leaf)) { throw "Required extractor bundle file missing: $Path" }
          }

          $Actual = (Get-FileHash -Algorithm SHA256 -Path $Exe).Hash.ToLowerInvariant()
          $Expected = ([string]$Lock.artifacts.'windows-amd64'.sha256).ToLowerInvariant()
          if ($Actual -ne $Expected) { throw "Final extractor SHA-256 drift: $Actual" }
          if ($Manifest.source_commit -ne $Lock.source.commit) { throw "Manifest source commit drift" }
          if ($Manifest.go_toolchain_version -ne $Lock.build.toolchain_version) { throw "Manifest Go lock drift" }
          if ($Manifest.cgo_enabled -ne $true) { throw "Manifest CGO contract drift" }
          if ($Manifest.native_distribution -ne $Lock.build.native_dependencies.'windows-amd64'.distribution) { throw "Manifest native distribution drift" }
          if ($Manifest.linkage -ne $Lock.build.platform_overrides.'windows-amd64'.linkage) { throw "Manifest linkage policy drift" }
          if ($Manifest.runtime_dependency_policy -ne $Lock.build.platform_overrides.'windows-amd64'.runtime_dependency_policy) { throw "Manifest runtime policy drift" }
          if ($Manifest.native_dependencies_verified -ne $true) { throw "Native dependency lock was not verified" }
          foreach ($Package in $Lock.build.native_dependencies.'windows-amd64'.packages.PSObject.Properties) {
            $ActualVersion = [string]$Manifest.native_package_versions.($Package.Name)
            if ($ActualVersion -ne [string]$Package.Value) {
              throw "Manifest native package drift for $($Package.Name): $ActualVersion"
            }
          }
          if ($Manifest.executable_sha256 -ne $Expected) { throw "Manifest executable hash drift" }
          if ($Manifest.source_lock_verified -ne $true) { throw "Source lock was not verified" }
          if ($Manifest.executable_hash_verified -ne $true) { throw "Executable hash was not verified" }
          if ($Manifest.runtime_dependencies_resolved -ne $true) { throw "Runtime dependency closure was not verified" }
          if ($Manifest.clean_path_smoke_passed -ne $true) { throw "Clean-PATH smoke was not recorded" }
          if ($Runtime.all_non_system_imports_resolved -ne $true) { throw "Runtime closure is incomplete" }
          if ($Runtime.executable_sha256 -ne $Expected) { throw "Runtime manifest executable hash drift" }
          if ([int]$Manifest.runtime_dependency_count -ne @($Runtime.runtime_dependencies).Count) { throw "Runtime dependency count drift" }

          foreach ($Dependency in @($Runtime.runtime_dependencies)) {
            $Path = Join-Path "dist/operator-tools" ([string]$Dependency.name)
            if (-not (Test-Path $Path -PathType Leaf)) { throw "Bundled runtime dependency missing: $Path" }
            $Digest = (Get-FileHash -Algorithm SHA256 -Path $Path).Hash.ToLowerInvariant()
            if ($Digest -ne [string]$Dependency.sha256) { throw "Bundled runtime dependency hash drift: $Path" }
          }

          foreach ($Field in @(
            "physical_interaction_performed",
            "external_device_command_executed",
            "persistent_write_authorized",
            "phone_storage_written",
            "hardware_verified",
            "beta_release_authorized",
            "beta_gate_credit"
          )) {
            if ($Manifest.$Field -ne $false) { throw "Unsafe manifest field: $Field" }
          }

          "$Actual  payload-dumper-go.exe" | Set-Content -Encoding ascii "dist/operator-tools/payload-dumper-go.exe.sha256"

      - name: Re-run clean-PATH smoke from the delivered directory
        shell: pwsh
        run: |
          $SavedPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Push-Location "dist/operator-tools"
            try {
              & ".\payload-dumper-go.exe" -h *> "payload-dumper-go-help-recheck.txt"
              $ExitCode = $LASTEXITCODE
            }
            finally {
              Pop-Location
            }
          }
          finally {
            $env:PATH = $SavedPath
          }
          if ($null -eq $ExitCode -or $ExitCode -ne 0) {
            throw "Delivered extractor bundle failed clean-PATH smoke: exit=$ExitCode"
          }

      - name: Upload exact non-release operator tool bundle
        uses: actions/upload-artifact@v4
        with:
          name: KaliPhoneStudio-windows-operator-extractor-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/operator-tools/
          if-no-files-found: error
          retention-days: 7
