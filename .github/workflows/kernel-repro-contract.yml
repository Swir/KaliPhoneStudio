name: kernel-repro-contract

on:
  push:
    paths:
      - "kaliphonestudio/kernel_contract.py"
      - "kaliphonestudio/kernel_bundle.py"
      - "kaliphonestudio/kernel_repro.py"
      - "kaliphonestudio/kernel_toolchain_bundle.py"
      - "kaliphonestudio/candidate.py"
      - "devices/**/profile.json"
      - "scripts/verify_kernel_repro_pair.py"
      - "tests/test_kernel_contract.py"
      - "tests/test_kernel_bundle.py"
      - "tests/test_kernel_repro.py"
      - "tests/test_kernel_toolchain_bundle.py"
      - "tests/test_candidate.py"
      - ".github/workflows/kernel-repro-contract.yml"
  pull_request:
    paths:
      - "kaliphonestudio/kernel_contract.py"
      - "kaliphonestudio/kernel_bundle.py"
      - "kaliphonestudio/kernel_repro.py"
      - "kaliphonestudio/kernel_toolchain_bundle.py"
      - "kaliphonestudio/candidate.py"
      - "devices/**/profile.json"
      - "scripts/verify_kernel_repro_pair.py"
      - "tests/test_kernel_contract.py"
      - "tests/test_kernel_bundle.py"
      - "tests/test_kernel_repro.py"
      - "tests/test_kernel_toolchain_bundle.py"
      - "tests/test_candidate.py"
      - ".github/workflows/kernel-repro-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-kernel-repro-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Compile kernel, compiler and first-boot evidence modules and CLI
        run: >-
          python -m py_compile
          kaliphonestudio/kernel_contract.py
          kaliphonestudio/kernel_bundle.py
          kaliphonestudio/kernel_repro.py
          kaliphonestudio/kernel_toolchain_bundle.py
          kaliphonestudio/candidate.py
          scripts/verify_kernel_repro_pair.py

      - name: Run kernel reproducibility, toolchain bundle and first-boot binding tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_kernel_contract.py
          tests/test_kernel_bundle.py
          tests/test_kernel_repro.py
          tests/test_kernel_toolchain_bundle.py
          tests/test_candidate.py
