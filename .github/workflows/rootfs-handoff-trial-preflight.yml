name: rootfs-handoff-trial-preflight

on:
  push:
    branches: [main]
    paths:
      - "kaliphonestudio/stable_file.py"
      - "kaliphonestudio/rootfs_handoff_trial_plan.py"
      - "kaliphonestudio/rootfs_handoff_trial_preflight.py"
      - "kaliphonestudio/operator_trial_evidence_cli.py"
      - "kaliphonestudio/operator_evidence_workspace.py"
      - "tests/test_stable_file.py"
      - "tests/test_rootfs_handoff_trial_plan.py"
      - "tests/test_rootfs_handoff_trial_preflight.py"
      - "tests/test_rootfs_trial_stable_evidence_reads.py"
      - "tests/test_operator_trial_evidence_workspace.py"
      - ".github/workflows/rootfs-handoff-trial-preflight.yml"
  pull_request:
    paths:
      - "kaliphonestudio/stable_file.py"
      - "kaliphonestudio/rootfs_handoff_trial_plan.py"
      - "kaliphonestudio/rootfs_handoff_trial_preflight.py"
      - "kaliphonestudio/operator_trial_evidence_cli.py"
      - "kaliphonestudio/operator_evidence_workspace.py"
      - "tests/test_stable_file.py"
      - "tests/test_rootfs_handoff_trial_plan.py"
      - "tests/test_rootfs_handoff_trial_preflight.py"
      - "tests/test_rootfs_trial_stable_evidence_reads.py"
      - "tests/test_operator_trial_evidence_workspace.py"
      - ".github/workflows/rootfs-handoff-trial-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install pytest
      - name: Compile exact preflight boundary
        run: >-
          python -m py_compile
          kaliphonestudio/stable_file.py
          kaliphonestudio/rootfs_handoff_trial_plan.py
          kaliphonestudio/rootfs_handoff_trial_preflight.py
          kaliphonestudio/operator_trial_evidence_cli.py
          kaliphonestudio/operator_evidence_workspace.py
      - name: Run fail-closed preflight and routing tests
        run: >-
          python -m pytest -q
          tests/test_stable_file.py
          tests/test_rootfs_handoff_trial_plan.py
          tests/test_rootfs_handoff_trial_preflight.py
          tests/test_rootfs_trial_stable_evidence_reads.py
          tests/test_operator_trial_evidence_workspace.py
