name: temporary-boot-identity-gate

on:
  push:
    branches: [main]
    paths:
      - "kaliphonestudio/temporary_boot_execution.py"
      - "kaliphonestudio/physical_candidate_operator.py"
      - "kaliphonestudio/physical_boot_identity_binding.py"
      - "tests/test_temporary_boot_execution.py"
      - "tests/test_physical_boot_identity_binding.py"
      - "tests/test_physical_candidate_operator.py"
      - ".github/workflows/temporary-boot-identity-gate.yml"
  pull_request:
    paths:
      - "kaliphonestudio/temporary_boot_execution.py"
      - "kaliphonestudio/physical_candidate_operator.py"
      - "kaliphonestudio/physical_boot_identity_binding.py"
      - "tests/test_temporary_boot_execution.py"
      - "tests/test_physical_boot_identity_binding.py"
      - "tests/test_physical_candidate_operator.py"
      - ".github/workflows/temporary-boot-identity-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-identity-before-device-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - name: Compile affected modules
        run: >-
          python -m compileall -q
          kaliphonestudio/temporary_boot_execution.py
          kaliphonestudio/physical_candidate_operator.py
          kaliphonestudio/physical_boot_identity_binding.py
      - name: Run exact identity and execution safety tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_physical_boot_identity_binding.py
          tests/test_temporary_boot_execution.py
          tests/test_physical_candidate_operator.py
