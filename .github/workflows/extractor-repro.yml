name: extractor-repro

on:
  push:
    paths:
      - "tools/extractor-locks.json"
      - ".github/workflows/extractor-repro.yml"
      - "scripts/stage_windows_extractor_runtime.ps1"
      - "kaliphonestudio/tool_locks.py"
      - "tests/test_tool_locks.py"
  pull_request:
    paths:
      - "tools/extractor-locks.json"
      - ".github/workflows/extractor-repro.yml"
      - "scripts/stage_windows_extractor_runtime.ps1"
      - "kaliphonestudio/tool_locks.py"
      - "tests/test_tool_locks.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducible-extractor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout KaliPhoneStudio
        uses: actions/checkout@v5

      - name: Read authoritative lock
        id: lock
        shell: python
        run: |
          import json, os
          from pathlib import Path
          data = json.loads(Path("tools/extractor-locks.json").read_text(encoding="utf-8"))
          source = data["source"]
          build = data["build"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              print(f"repository={source['url'].removeprefix('https://github.com/')}", file=f)
              print(f"commit={source['commit']}", file=f)
              print(f"go_version={build['toolchain_version']}", file=f)

      - name: Checkout exact extractor source commit
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.lock.outputs.repository }}
          ref: ${{ steps.lock.outputs.commit }}
          path: upstream-extractor
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        working-directory: upstream-extractor
        run: test "$(git rev-parse HEAD)" = "${{ steps.lock.outputs.commit }}"

      - name: Setup pinned Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.lock.outputs.go_version }}
          cache-dependency-path: upstream-extractor/go.sum

      - name: Verify upstream Go requirement matches lock
        shell: python
        run: |
          import re
          from pathlib import Path
          text = Path("upstream-extractor/go.mod").read_text(encoding="utf-8")
          match = re.search(r"(?m)^go\s+([^\s]+)$", text)
          if not match:
              raise SystemExit("upstream go.mod has no Go version")
          expected = "${{ steps.lock.outputs.go_version }}"
          if match.group(1) != expected:
              raise SystemExit(f"toolchain lock {expected} != upstream go.mod {match.group(1)}")

      - name: Install Linux liblzma build dependency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends liblzma-dev

      - name: Install Windows CGO and liblzma build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-xz'
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 extractor prerequisites failed: $LASTEXITCODE" }
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CC=C:\msys64\mingw64\bin\gcc.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CXX=C:\msys64\mingw64\bin\g++.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_CFLAGS=-IC:/msys64/mingw64/include' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_LDFLAGS=-LC:/msys64/mingw64/lib' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Windows native authority and toolchain visibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Lock = Get-Content -Raw -Encoding UTF8 "tools/extractor-locks.json" | ConvertFrom-Json
          $Native = $Lock.build.native_dependencies.'windows-amd64'
          $Windows = $Lock.build.platform_overrides.'windows-amd64'
          if ($Windows.linkage -ne 'mixed-side-by-side') { throw 'Windows linkage policy drift' }
          if ($Windows.ldflags -ne '-buildid= -extldflags=-static') { throw 'Windows ldflags drift' }
          if ($Windows.runtime_dependency_policy -ne 'recursive-non-system-pe-import-closure') { throw 'Windows runtime policy drift' }
          foreach ($Package in $Native.packages.PSObject.Properties) {
            $Actual = (& 'C:\msys64\usr\bin\pacman.exe' -Q $Package.Name 2>&1 | Out-String).Trim()
            $Expected = "$($Package.Name) $($Package.Value)"
            if ($Actual -ne $Expected) { throw "Native package drift: expected '$Expected', got '$Actual'" }
          }
          if (-not (Test-Path 'C:\msys64\mingw64\include\lzma.h')) { throw 'lzma.h is not installed' }
          if (-not (Test-Path 'C:\msys64\mingw64\bin\objdump.exe')) { throw 'MinGW objdump is not installed' }
          & $env:CC --version
          if ($LASTEXITCODE -ne 0) { throw 'MinGW GCC is not executable' }

      - name: Build twice from pinned source
        shell: bash
        working-directory: upstream-extractor
        env:
          CGO_ENABLED: "1"
        run: |
          if [ "${{ matrix.platform }}" = "windows-amd64" ]; then
            go build -trimpath -buildvcs=false -ldflags='-buildid= -extldflags=-static' -o ../extractor-a .
            go clean -cache
            go build -trimpath -buildvcs=false -ldflags='-buildid= -extldflags=-static' -o ../extractor-b .
          else
            go build -trimpath -buildvcs=false -ldflags=-buildid= -o ../extractor-a .
            go clean -cache
            go build -trimpath -buildvcs=false -ldflags=-buildid= -o ../extractor-b .
          fi

      - name: Prove byte-for-byte reproducibility and record observed SHA-256
        id: proof
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          a = Path("extractor-a").read_bytes()
          b = Path("extractor-b").read_bytes()
          if a != b:
              raise SystemExit("pinned extractor builds are not byte-for-byte reproducible")
          digest = hashlib.sha256(a).hexdigest()
          lock = json.loads(Path("tools/extractor-locks.json").read_text(encoding="utf-8"))
          expected = lock["artifacts"]["${{ matrix.platform }}"]["sha256"]
          matches_lock = digest == expected
          Path("extractor-${{ matrix.platform }}.sha256").write_text(
              f"{digest}  payload-dumper-go\n", encoding="ascii"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              print(f"digest={digest}", file=f)
              print(f"matches_lock={'true' if matches_lock else 'false'}", file=f)
              print(f"expected={expected}", file=f)
          print("${{ matrix.platform }} observed SHA-256:", digest)
          print("${{ matrix.platform }} locked SHA-256:", expected)

      - name: Stage and smoke-test self-contained Windows runtime closure
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/stage_windows_extractor_runtime.ps1 `
            -Executable "extractor-a" `
            -OutputDir "extractor-runtime-bundle"
          if ($LASTEXITCODE -ne 0) { throw "Runtime closure staging failed: $LASTEXITCODE" }
          $Runtime = Get-Content -Raw -Encoding UTF8 "extractor-runtime-bundle/operator-extractor-runtime.json" | ConvertFrom-Json
          if ($Runtime.all_non_system_imports_resolved -ne $true) { throw "Runtime closure is incomplete" }
          if ($Runtime.executable_sha256 -ne ((Get-Content -Raw "extractor-windows-amd64.sha256").Split()[0])) { throw "Runtime executable hash drift" }

      - name: Upload reproducibility evidence with observed digest
        if: always() && steps.proof.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: extractor-repro-${{ matrix.platform }}-${{ steps.proof.outputs.digest }}
          path: |
            extractor-${{ matrix.platform }}.sha256
            extractor-runtime-bundle/
          if-no-files-found: ignore

      - name: Enforce reviewed extractor digest lock
        if: steps.proof.outcome == 'success' && steps.proof.outputs.matches_lock != 'true'
        shell: python
        run: |
          raise SystemExit(
              "${{ matrix.platform }} digest drift: expected "
              "${{ steps.proof.outputs.expected }}, got ${{ steps.proof.outputs.digest }}. "
              "A/B equality and runtime evidence were preserved for explicit review; update the lock only after reviewing this exact-head evidence."
          )
