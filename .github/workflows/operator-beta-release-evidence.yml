name: operator-beta-release-evidence

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "kaliphonestudio/operator_evidence_workspace.py"
      - "kaliphonestudio/operator_beta_release_evidence_cli.py"
      - "kaliphonestudio/beta_release_artifact_inventory.py"
      - "kaliphonestudio/beta_release_review_manifest.py"
      - "kaliphonestudio/stable_file.py"
      - "tests/test_operator_beta_release_evidence_cli.py"
      - "tests/test_beta_release_artifact_inventory.py"
      - "tests/test_beta_release_review_manifest.py"
      - "docs/BETA_RELEASE_OPERATOR_WORKSPACE.md"
      - ".github/workflows/operator-beta-release-evidence.yml"
  pull_request:
    paths:
      - "main.py"
      - "kaliphonestudio/operator_evidence_workspace.py"
      - "kaliphonestudio/operator_beta_release_evidence_cli.py"
      - "kaliphonestudio/beta_release_artifact_inventory.py"
      - "kaliphonestudio/beta_release_review_manifest.py"
      - "kaliphonestudio/stable_file.py"
      - "tests/test_operator_beta_release_evidence_cli.py"
      - "tests/test_beta_release_artifact_inventory.py"
      - "tests/test_beta_release_review_manifest.py"
      - "docs/BETA_RELEASE_OPERATOR_WORKSPACE.md"
      - ".github/workflows/operator-beta-release-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta-release-evidence-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install pytest
      - name: Compile release-preparation boundaries
        run: >-
          python -m py_compile
          kaliphonestudio/operator_beta_release_evidence_cli.py
          kaliphonestudio/operator_evidence_workspace.py
          kaliphonestudio/beta_release_artifact_inventory.py
          kaliphonestudio/beta_release_review_manifest.py
          tests/test_operator_beta_release_evidence_cli.py
      - name: Run exact release-preparation contracts
        run: >-
          python -m pytest -q
          tests/test_operator_beta_release_evidence_cli.py
          tests/test_beta_release_artifact_inventory.py
          tests/test_beta_release_review_manifest.py
      - name: Assert offline non-publishing boundary
        shell: python
        run: |
          from pathlib import Path

          paths = (
              Path("kaliphonestudio/operator_beta_release_evidence_cli.py"),
              Path("kaliphonestudio/beta_release_artifact_inventory.py"),
              Path("kaliphonestudio/beta_release_review_manifest.py"),
          )
          forbidden = (
              "import subprocess",
              "from subprocess",
              "import requests",
              "from requests",
              "fastboot ",
              "adb ",
              "release_publication_allowed=True",
              "beta_release_authorized=True",
              "hardware_verified=True",
              "beta_gate_credit=True",
          )
          failures = {}
          for path in paths:
              text = path.read_text(encoding="utf-8")
              found = [needle for needle in forbidden if needle in text]
              if found:
                  failures[str(path)] = found
          if failures:
              raise SystemExit(f"offline Beta release-preparation boundary violated: {failures}")
          print("offline Beta release-preparation boundary: PASS")

  frozen-windows-command-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen-build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r build/windows-requirements.txt
      - name: Build frozen Windows host CLI
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Verify unified Beta release commands fail closed
        shell: pwsh
        run: |
          $Cli = (Resolve-Path "dist/KaliPhoneStudioCLI/KaliPhoneStudioCLI.exe").Path

          foreach ($Command in @(
            "build-beta-artifact-inventory",
            "build-beta-review-manifest"
          )) {
            & $Cli evidence $Command --help | Set-Content -Encoding utf8 ("dist/help-" + $Command + ".txt")
            if ($LASTEXITCODE -ne 0) { throw "Frozen help failed for $Command : $LASTEXITCODE" }
          }

          & $Cli evidence build-beta-artifact-inventory `
            --candidate-gate "dist/missing-candidate.json" `
            --release-gate-audit "dist/missing-release-audit.json" `
            --strategy-review "dist/missing-strategy.json" `
            --source-commit "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" `
            --artifact "candidate_boot=dist/missing-boot.img" `
            --out "dist/should-not-inventory.json" 2> "dist/refusal-inventory.txt"
          if ($LASTEXITCODE -ne 2) { throw "Frozen inventory did not fail closed: $LASTEXITCODE" }
          if (Test-Path "dist/should-not-inventory.json") { throw "Refused inventory created output" }

          New-Item -ItemType Directory -Force "dist/release-candidate" | Out-Null
          & $Cli evidence build-beta-review-manifest `
            --inventory "dist/missing-inventory.json" `
            --release-dir "dist/release-candidate" `
            --version "0.6.67-dev" `
            --manifest-out "dist/should-not-manifest.json" `
            --checksums-out "dist/should-not-SHA256SUMS" 2> "dist/refusal-manifest.txt"
          if ($LASTEXITCODE -ne 2) { throw "Frozen review manifest did not fail closed: $LASTEXITCODE" }
          if (Test-Path "dist/should-not-manifest.json") { throw "Refused manifest created output" }
          if (Test-Path "dist/should-not-SHA256SUMS") { throw "Refused manifest created SHA256SUMS" }

          # Both negative smoke commands intentionally return 2 after a verified refusal.
          # Reset the native exit code only after every fail-closed assertion above passed,
          # so the PowerShell step itself reports success without weakening the refusal checks.
          $global:LASTEXITCODE = 0
          exit 0
