name: rootfs-handoff-trial-metadata-manifest

on:
  push:
    branches: [main]
    paths:
      - "kaliphonestudio/stable_file.py"
      - "kaliphonestudio/rootfs_handoff_trial_payload.py"
      - "kaliphonestudio/rootfs_handoff_trial_metadata.py"
      - "scripts/build_rootfs_handoff_trial_metadata_manifest.py"
      - "tests/test_rootfs_handoff_trial_metadata.py"
      - "docs/ROOTFS_HANDOFF_TRIAL_METADATA_MANIFEST.md"
      - ".github/workflows/rootfs-handoff-trial-metadata-manifest.yml"
  pull_request:
    paths:
      - "kaliphonestudio/stable_file.py"
      - "kaliphonestudio/rootfs_handoff_trial_payload.py"
      - "kaliphonestudio/rootfs_handoff_trial_metadata.py"
      - "scripts/build_rootfs_handoff_trial_metadata_manifest.py"
      - "tests/test_rootfs_handoff_trial_metadata.py"
      - "docs/ROOTFS_HANDOFF_TRIAL_METADATA_MANIFEST.md"
      - ".github/workflows/rootfs-handoff-trial-metadata-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-manifest-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install pytest
      - name: Compile exact rootfs metadata boundary
        run: >-
          python -m py_compile
          kaliphonestudio/rootfs_handoff_trial_metadata.py
          scripts/build_rootfs_handoff_trial_metadata_manifest.py
          tests/test_rootfs_handoff_trial_metadata.py
      - name: Run fail-closed rootfs metadata tests
        run: python -m pytest -q tests/test_rootfs_handoff_trial_metadata.py
      - name: Assert metadata boundary remains host-only and non-writing
        shell: python
        run: |
          from pathlib import Path
          text = Path("kaliphonestudio/rootfs_handoff_trial_metadata.py").read_text(encoding="utf-8")
          forbidden = (
              "subprocess", "os.system", "fastboot ", "adb ", "mount(", "extractall(",
              "persistent_write_authorized=True", "phone_storage_written=True", "beta_gate_credit=True",
          )
          found = [needle for needle in forbidden if needle in text]
          if found:
              raise SystemExit(f"rootfs metadata boundary crossed non-writing contract: {found}")
          print("rootfs metadata boundary: PASS")
