name: progress-svg

on:
  push:
    branches: [main]
    paths:
      - "BUILD_STATUS.json"
      - "README.md"
      - "ROADMAP.md"
      - "assets/readme/progress-card.svg"
      - "assets/readme/progress-mini.svg"
      - "assets/readme/progress-template.svg"
      - "scripts/generate_progress_svgs.py"
      - "tests/test_progress_svgs.py"
      - ".github/workflows/progress-svg.yml"
  pull_request:
    paths:
      - "BUILD_STATUS.json"
      - "README.md"
      - "ROADMAP.md"
      - "assets/readme/progress-card.svg"
      - "assets/readme/progress-mini.svg"
      - "assets/readme/progress-template.svg"
      - "scripts/generate_progress_svgs.py"
      - "tests/test_progress_svgs.py"
      - ".github/workflows/progress-svg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Verify generated progress SVGs are current
        run: python scripts/generate_progress_svgs.py --check
      - name: Run progress SVG contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install pytest
          pytest -q tests/test_progress_svgs.py
