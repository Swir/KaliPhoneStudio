name: rescue-payload-repro

on:
  push:
    paths:
      - "tools/rescue-payload-lock.json"
      - "rescue/busybox-minimal.config"
      - "rescue/init"
      - "kaliphonestudio/rescue_payload.py"
      - "kaliphonestudio/rescue_payload_repro.py"
      - "kaliphonestudio/rescue_candidate.py"
      - "kaliphonestudio/physical_boot_observation.py"
      - "kaliphonestudio/initramfs.py"
      - "kaliphonestudio/lz4_legacy.py"
      - "scripts/apply_busybox_miniconfig.py"
      - "scripts/build_verified_rescue_candidate.py"
      - "scripts/record_physical_boot_observation.py"
      - "tests/test_rescue_candidate.py"
      - "tests/test_physical_boot_observation.py"
      - ".github/workflows/rescue-payload-repro.yml"
  pull_request:
    paths:
      - "tools/rescue-payload-lock.json"
      - "rescue/busybox-minimal.config"
      - "rescue/init"
      - "kaliphonestudio/rescue_payload.py"
      - "kaliphonestudio/rescue_payload_repro.py"
      - "kaliphonestudio/rescue_candidate.py"
      - "kaliphonestudio/physical_boot_observation.py"
      - "kaliphonestudio/initramfs.py"
      - "kaliphonestudio/lz4_legacy.py"
      - "scripts/apply_busybox_miniconfig.py"
      - "scripts/build_verified_rescue_candidate.py"
      - "scripts/record_physical_boot_observation.py"
      - "tests/test_rescue_candidate.py"
      - "tests/test_physical_boot_observation.py"
      - ".github/workflows/rescue-payload-repro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-rescue-payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout KaliPhoneStudio
        uses: actions/checkout@v5

      - name: Read authoritative rescue build lock
        id: lock
        shell: python
        run: |
          import json, os
          from pathlib import Path
          data = json.loads(Path("tools/rescue-payload-lock.json").read_text(encoding="utf-8"))
          source = data["busybox"]
          build = data["build"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              print(f"source_url={source['source_url']}", file=f)
              print(f"source_sha256={source['source_sha256']}", file=f)
              print(f"cross_compile={build['cross_compile']}", file=f)
              print(f"kconfig_target={build['kconfig_target']}", file=f)
              print(f"make_target={build['make_target']}", file=f)
              print(f"ldflags={build['ldflags']}", file=f)
              print(f"source_date_epoch={build['source_date_epoch']}", file=f)

      - name: Verify checked-in rescue material locks before expensive build
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path

          lock = json.loads(Path("tools/rescue-payload-lock.json").read_text(encoding="utf-8"))
          materials = lock["materials"]
          for relative, key in (
              ("rescue/busybox-minimal.config", "config_sha256"),
              ("rescue/init", "init_sha256"),
          ):
              actual = hashlib.sha256(Path(relative).read_bytes()).hexdigest()
              expected = materials[key]
              print(f"{relative}: expected={expected} actual={actual}")
              if actual != expected:
                  raise SystemExit(f"locked material drift: {relative}")

      - name: Install ARM64 cross-build and execution prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user-static make bzip2 curl ca-certificates

      - name: Fetch and verify exact BusyBox source archive
        shell: bash
        env:
          SOURCE_URL: ${{ steps.lock.outputs.source_url }}
          SOURCE_SHA256: ${{ steps.lock.outputs.source_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p build/source
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            "$SOURCE_URL" --output build/source/busybox.tar.bz2
          printf '%s  %s\n' "$SOURCE_SHA256" build/source/busybox.tar.bz2 | sha256sum -c -

      - name: Build two independent static ARM64 rescue binaries
        shell: bash
        env:
          CROSS_COMPILE: ${{ steps.lock.outputs.cross_compile }}
          KCONFIG_TARGET: ${{ steps.lock.outputs.kconfig_target }}
          MAKE_TARGET: ${{ steps.lock.outputs.make_target }}
          LOCKED_LDFLAGS: ${{ steps.lock.outputs.ldflags }}
          SOURCE_DATE_EPOCH: ${{ steps.lock.outputs.source_date_epoch }}
          KBUILD_BUILD_USER: kaliphonestudio
          KBUILD_BUILD_HOST: reproducible
          KBUILD_BUILD_VERSION: "1"
          LC_ALL: C
          TZ: UTC
        run: |
          set -euo pipefail
          for pass in a b; do
            mkdir -p "build/$pass"
            tar -xjf build/source/busybox.tar.bz2 -C "build/$pass" --strip-components=1
            (
              cd "build/$pass"
              make CROSS_COMPILE="$CROSS_COMPILE" "$KCONFIG_TARGET" >/dev/null
              python "$GITHUB_WORKSPACE/scripts/apply_busybox_miniconfig.py" \
                --miniconfig "$GITHUB_WORKSPACE/rescue/busybox-minimal.config" \
                --config .config
              make CROSS_COMPILE="$CROSS_COMPILE" silentoldconfig >/dev/null
              python "$GITHUB_WORKSPACE/scripts/apply_busybox_miniconfig.py" \
                --miniconfig "$GITHUB_WORKSPACE/rescue/busybox-minimal.config" \
                --config .config --check
              LDFLAGS="$LOCKED_LDFLAGS" \
                make -j2 CROSS_COMPILE="$CROSS_COMPILE" "$MAKE_TARGET"
            )
            qemu-aarch64-static "build/$pass/busybox" --list | LC_ALL=C sort -u > "build/applets-$pass.txt"
            test -s "build/applets-$pass.txt"
            cp "build/$pass/busybox" "build/busybox-$pass"
          done
          cmp build/busybox-a build/busybox-b
          cmp build/applets-a.txt build/applets-b.txt
          file build/busybox-a
          sha256sum build/busybox-a build/busybox-b

      - name: Build profile-formatted candidate through the verified evidence chain
        shell: bash
        env:
          CROSS_COMPILE: ${{ steps.lock.outputs.cross_compile }}
        run: |
          set -euo pipefail
          compiler="${CROSS_COMPILE}gcc"
          compiler_id="$($compiler --version | head -n 1)"
          target_machine="$($compiler -dumpmachine)"
          mkdir -p build/evidence
          python scripts/build_verified_rescue_candidate.py \
            --profile-id oneplus/avicii \
            --source-archive build/source/busybox.tar.bz2 \
            --busybox-a build/busybox-a \
            --busybox-b build/busybox-b \
            --applets-a build/applets-a.txt \
            --applets-b build/applets-b.txt \
            --compiler-id "$compiler_id" \
            --target-machine "$target_machine" \
            --out build/rescue.cpio.lz4 \
            --repro-evidence build/evidence/rescue-payload-repro.json \
            --candidate-evidence build/evidence/rescue-candidate.json
          sha256sum build/rescue.cpio.lz4 > build/evidence/rescue.cpio.lz4.sha256

      - name: Cross-check schema-v2 candidate probe evidence and offline policy
        shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          import hashlib, json
          from pathlib import Path
          from kaliphonestudio.rescue_candidate import load_rescue_candidate_evidence

          candidate_path = Path("build/evidence/rescue-candidate.json")
          candidate = load_rescue_candidate_evidence(candidate_path)
          repro = json.loads(Path("build/evidence/rescue-payload-repro.json").read_text(encoding="utf-8"))
          ramdisk = Path("build/rescue.cpio.lz4").read_bytes()
          if candidate.schema_version != 2:
              raise SystemExit("rescue candidate evidence schema drift")
          if candidate.profile_id != "oneplus/avicii":
              raise SystemExit("candidate profile drift")
          if candidate.ramdisk_compression != "lz4":
              raise SystemExit("avicii rescue candidate must use LZ4")
          if candidate.ramdisk_sha256 != hashlib.sha256(ramdisk).hexdigest():
              raise SystemExit("candidate ramdisk hash drift")
          if len(candidate.rescue_probe_id) != 64 or any(ch not in "0123456789abcdef" for ch in candidate.rescue_probe_id):
              raise SystemExit("candidate rescue probe id is invalid")
          probe_bytes = (candidate.rescue_probe_id + "\n").encode("ascii")
          if candidate.rescue_probe_file_sha256 != hashlib.sha256(probe_bytes).hexdigest():
              raise SystemExit("candidate rescue probe file digest drift")
          if repro["independent_builds"] != 2 or repro["reproducible"] is not True:
              raise SystemExit("payload reproducibility evidence is incomplete")
          if repro["architecture"] != "arm64" or repro["target_machine"] != "aarch64-linux-gnu":
              raise SystemExit("payload architecture evidence drift")
          init = Path("rescue/init").read_text(encoding="utf-8")
          if "KPS_RESCUE_STAGE=init-reached-v1" not in init or "KPS_RESCUE_PROBE_ID=" not in init:
              raise SystemExit("locked rescue init no longer emits physical proof markers")

      - name: Upload reproducibility evidence only
        uses: actions/upload-artifact@v4
        with:
          name: rescue-payload-repro-evidence
          path: |
            build/evidence/rescue-payload-repro.json
            build/evidence/rescue-candidate.json
            build/evidence/rescue.cpio.lz4.sha256
          if-no-files-found: error

      - name: Upload exact rescue payload for the physical bring-up candidate
        uses: actions/upload-artifact@v4
        with:
          name: rescue-payload-physical-candidate-${{ github.sha }}
          path: |
            build/rescue.cpio.lz4
            build/evidence/rescue-payload-repro.json
            build/evidence/rescue-candidate.json
            build/evidence/rescue.cpio.lz4.sha256
            tools/rescue-payload-lock.json
          if-no-files-found: error
          retention-days: 30
