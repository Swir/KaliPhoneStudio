name: physical-hardware-functional-results

on:
  push:
    branches: [main]
    paths:
      - "kaliphonestudio/physical_hardware_test_plan.py"
      - "kaliphonestudio/physical_hardware_test_observation.py"
      - "kaliphonestudio/physical_hardware_test_review.py"
      - "kaliphonestudio/physical_hardware_test_summary.py"
      - "scripts/prepare_physical_hardware_test_observation.py"
      - "scripts/record_physical_hardware_test_observation.py"
      - "scripts/prepare_physical_hardware_test_review.py"
      - "scripts/review_physical_hardware_test_observation.py"
      - "scripts/summarize_physical_hardware_tests.py"
      - "tests/test_physical_hardware_functional_results.py"
      - ".github/workflows/physical-hardware-functional-results.yml"
  pull_request:
    paths:
      - "kaliphonestudio/physical_hardware_test_plan.py"
      - "kaliphonestudio/physical_hardware_test_observation.py"
      - "kaliphonestudio/physical_hardware_test_review.py"
      - "kaliphonestudio/physical_hardware_test_summary.py"
      - "scripts/prepare_physical_hardware_test_observation.py"
      - "scripts/record_physical_hardware_test_observation.py"
      - "scripts/prepare_physical_hardware_test_review.py"
      - "scripts/review_physical_hardware_test_observation.py"
      - "scripts/summarize_physical_hardware_tests.py"
      - "tests/test_physical_hardware_functional_results.py"
      - ".github/workflows/physical-hardware-functional-results.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest
      - name: Compile physical functional-test evidence sources
        run: >-
          python -m py_compile
          kaliphonestudio/physical_hardware_test_observation.py
          kaliphonestudio/physical_hardware_test_review.py
          kaliphonestudio/physical_hardware_test_summary.py
          scripts/prepare_physical_hardware_test_observation.py
          scripts/record_physical_hardware_test_observation.py
          scripts/prepare_physical_hardware_test_review.py
          scripts/review_physical_hardware_test_observation.py
          scripts/summarize_physical_hardware_tests.py
          tests/test_physical_hardware_functional_results.py
      - name: Run fail-closed physical functional-test evidence tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_physical_hardware_functional_results.py
