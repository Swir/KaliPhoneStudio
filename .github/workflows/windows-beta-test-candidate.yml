name: windows-beta-test-candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-beta-test-candidate.yml"
      - "main.py"
      - "kaliphonestudio/**"
      - "devices/oneplus/avicii/profile.json"
      - "tools/fastboot-tool-policy.json"
      - "tools/extractor-locks.json"
      - "BETA_RELEASE_GATE.md"
      - "BUILD_STATUS.json"
      - "docs/AC2003_FIRST_TEST.md"
      - "docs/AC2003_OFFLINE_CANDIDATE_PREPARATION.md"
      - "docs/BETA_RELEASE_OPERATOR_WORKSPACE.md"
      - "docs/BETA_RELEASE_ARTIFACT_INVENTORY.md"
      - "docs/BETA_RELEASE_REVIEW_MANIFEST.md"
      - "docs/WINDOWS_OPERATOR_EXTRACTOR.md"
      - "scripts/build_windows.ps1"
      - "scripts/build_windows_operator_extractor.ps1"
      - "scripts/stage_windows_extractor_runtime.ps1"
      - "scripts/smoke_windows_beta_test_candidate.ps1"
      - "scripts/package_windows_beta_test_candidate.ps1"
      - "scripts/preflight_ac2003_first_test.ps1"
      - "scripts/start_ac2003_readonly_baseline.ps1"
      - "scripts/verify_windows_beta_test_candidate.ps1"
      - "build/windows-requirements.txt"
      - "requirements.txt"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/windows-beta-test-candidate.yml"
      - "main.py"
      - "kaliphonestudio/**"
      - "devices/oneplus/avicii/profile.json"
      - "tools/fastboot-tool-policy.json"
      - "tools/extractor-locks.json"
      - "BETA_RELEASE_GATE.md"
      - "BUILD_STATUS.json"
      - "docs/AC2003_FIRST_TEST.md"
      - "docs/AC2003_OFFLINE_CANDIDATE_PREPARATION.md"
      - "docs/BETA_RELEASE_OPERATOR_WORKSPACE.md"
      - "docs/BETA_RELEASE_ARTIFACT_INVENTORY.md"
      - "docs/BETA_RELEASE_REVIEW_MANIFEST.md"
      - "docs/WINDOWS_OPERATOR_EXTRACTOR.md"
      - "scripts/build_windows.ps1"
      - "scripts/build_windows_operator_extractor.ps1"
      - "scripts/stage_windows_extractor_runtime.ps1"
      - "scripts/smoke_windows_beta_test_candidate.ps1"
      - "scripts/package_windows_beta_test_candidate.ps1"
      - "scripts/preflight_ac2003_first_test.ps1"
      - "scripts/start_ac2003_readonly_baseline.ps1"
      - "scripts/verify_windows_beta_test_candidate.ps1"
      - "build/windows-requirements.txt"
      - "requirements.txt"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-beta-test-candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # PR github.sha is a synthetic merge commit; the artifact must identify
          # and contain the exact development head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
          cache: false

      - name: Install exact host build and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r build/windows-requirements.txt
          python -m pip install pytest
          python -m PyInstaller --version

      - name: Install reviewed Windows extractor native prerequisites
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-xz'
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 extractor prerequisites failed: $LASTEXITCODE" }
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CC=C:\msys64\mingw64\bin\gcc.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CXX=C:\msys64\mingw64\bin\g++.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_ENABLED=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_CFLAGS=-IC:/msys64/mingw64/include' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_LDFLAGS=-LC:/msys64/mingw64/lib' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Beta-test-candidate safety, packaging and extractor contracts
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_windows_beta_test_candidate_contract.py
          tests/test_windows_packaging_contract.py
          tests/test_windows_operator_extractor_contract.py
          tests/test_ac2003_host_preflight_contract.py
          tests/test_extractor.py
          tests/test_tool_locks.py
          tests/test_operator_beta_release_evidence_cli.py
          tests/test_beta_release_artifact_inventory.py
          tests/test_beta_release_review_manifest.py
          tests/test_physical_fastboot_capture.py
          tests/test_physical_first_test_session.py
          tests/test_stock_baseline_ingress.py
          tests/test_physical_candidate_operator.py
          tests/test_physical_boot_identity_operator.py
          tests/test_physical_boot_identity_binding.py
          tests/test_physical_recovery_operator.py
          tests/test_physical_recovery_readiness.py
          tests/test_temporary_boot_execution.py

      - name: Build frozen Windows GUI and CLI
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Build exact bundled OTA extractor and runtime closure
        shell: pwsh
        run: ./scripts/build_windows_operator_extractor.ps1 -OutputDir "dist/operator-tools"

      - name: Smoke-test exact frozen AC2003 operator surface and bundled extractor
        shell: pwsh
        run: ./scripts/smoke_windows_beta_test_candidate.ps1 -CandidateRoot "dist"

      - name: Package, host-preflight, read-only baseline launcher and self-verify integrated AC2003 host test candidate
        shell: pwsh
        run: >-
          ./scripts/package_windows_beta_test_candidate.ps1
          -SourceCommit "${{ github.event.pull_request.head.sha || github.sha }}"
          -DistRoot "dist"

      - name: Upload unsigned integrated AC2003 Beta test candidate
        uses: actions/upload-artifact@v4
        with:
          name: KaliPhoneStudio-AC2003-beta-test-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/KaliPhoneStudio-AC2003-beta-test-candidate.zip
            dist/KaliPhoneStudio-AC2003-beta-test-candidate.zip.sha256
            dist/BETA_TEST_CANDIDATE_INFO.json
