name: windows-beta-test-candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-beta-test-candidate.yml"
      - "main.py"
      - "kaliphonestudio/**"
      - "devices/oneplus/avicii/profile.json"
      - "tools/fastboot-tool-policy.json"
      - "tools/extractor-locks.json"
      - "BETA_RELEASE_GATE.md"
      - "BUILD_STATUS.json"
      - "docs/AC2003_FIRST_TEST.md"
      - "docs/AC2003_OFFLINE_CANDIDATE_PREPARATION.md"
      - "docs/OPERATOR_WORKSPACE.md"
      - "docs/KALI_EARLY_USERSPACE_PROOF.md"
      - "docs/ROOTFS_HANDOFF_*.md"
      - "docs/ROOTFS_TRIAL_CHAIN_AUDIT.md"
      - "docs/BETA_RELEASE_OPERATOR_WORKSPACE.md"
      - "docs/BETA_RELEASE_ARTIFACT_INVENTORY.md"
      - "docs/BETA_RELEASE_REVIEW_MANIFEST.md"
      - "docs/WINDOWS_OPERATOR_EXTRACTOR.md"
      - "scripts/build_windows.ps1"
      - "scripts/build_windows_operator_extractor.ps1"
      - "scripts/stage_windows_extractor_runtime.ps1"
      - "scripts/smoke_windows_beta_test_candidate.ps1"
      - "scripts/package_windows_beta_test_candidate.ps1"
      - "scripts/preflight_ac2003_first_test.ps1"
      - "scripts/start_ac2003_readonly_baseline.ps1"
      - "scripts/start_ac2003_first_test_wizard.ps1"
      - "scripts/bootstrap_ac2003_first_test.ps1"
      - "scripts/start_ac2003_first_test.cmd"
      - "scripts/overlay_ac2003_first_test_wizard.ps1"
      - "tools/ac2003-bootstrap-lock.json"
      - "scripts/verify_windows_beta_test_candidate.ps1"
      - "build/windows-requirements.txt"
      - "requirements.txt"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/windows-beta-test-candidate.yml"
      - "main.py"
      - "kaliphonestudio/**"
      - "devices/oneplus/avicii/profile.json"
      - "tools/fastboot-tool-policy.json"
      - "tools/extractor-locks.json"
      - "BETA_RELEASE_GATE.md"
      - "BUILD_STATUS.json"
      - "docs/AC2003_FIRST_TEST.md"
      - "docs/AC2003_OFFLINE_CANDIDATE_PREPARATION.md"
      - "docs/OPERATOR_WORKSPACE.md"
      - "docs/KALI_EARLY_USERSPACE_PROOF.md"
      - "docs/ROOTFS_HANDOFF_*.md"
      - "docs/ROOTFS_TRIAL_CHAIN_AUDIT.md"
      - "docs/BETA_RELEASE_OPERATOR_WORKSPACE.md"
      - "docs/BETA_RELEASE_ARTIFACT_INVENTORY.md"
      - "docs/BETA_RELEASE_REVIEW_MANIFEST.md"
      - "docs/WINDOWS_OPERATOR_EXTRACTOR.md"
      - "scripts/build_windows.ps1"
      - "scripts/build_windows_operator_extractor.ps1"
      - "scripts/stage_windows_extractor_runtime.ps1"
      - "scripts/smoke_windows_beta_test_candidate.ps1"
      - "scripts/package_windows_beta_test_candidate.ps1"
      - "scripts/preflight_ac2003_first_test.ps1"
      - "scripts/start_ac2003_readonly_baseline.ps1"
      - "scripts/start_ac2003_first_test_wizard.ps1"
      - "scripts/bootstrap_ac2003_first_test.ps1"
      - "scripts/start_ac2003_first_test.cmd"
      - "scripts/overlay_ac2003_first_test_wizard.ps1"
      - "tools/ac2003-bootstrap-lock.json"
      - "scripts/verify_windows_beta_test_candidate.ps1"
      - "build/windows-requirements.txt"
      - "requirements.txt"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-beta-test-candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # PR github.sha is a synthetic merge commit; the artifact must identify
          # and contain the exact development head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
          cache: false

      - name: Install exact host build and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r build/windows-requirements.txt
          python -m pip install pytest
          python -m PyInstaller --version

      - name: Install reviewed Windows extractor native prerequisites
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-xz'
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 extractor prerequisites failed: $LASTEXITCODE" }
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CC=C:\msys64\mingw64\bin\gcc.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CXX=C:\msys64\mingw64\bin\g++.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_ENABLED=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_CFLAGS=-IC:/msys64/mingw64/include' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_LDFLAGS=-LC:/msys64/mingw64/lib' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Beta-test-candidate safety, packaging and extractor contracts
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_windows_beta_test_candidate_contract.py
          tests/test_windows_beta_operator_pack_contract.py
          tests/test_windows_packaging_contract.py
          tests/test_windows_operator_extractor_contract.py
          tests/test_ac2003_host_preflight_contract.py
          tests/test_ac2003_first_test_wizard_contract.py
          tests/test_physical_gui_bridge.py
          tests/test_extractor.py
          tests/test_tool_locks.py
          tests/test_operator_beta_release_evidence_cli.py
          tests/test_beta_release_artifact_inventory.py
          tests/test_beta_release_review_manifest.py
          tests/test_physical_fastboot_capture.py
          tests/test_physical_first_test_session.py
          tests/test_stock_baseline_ingress.py
          tests/test_physical_candidate_operator.py
          tests/test_physical_boot_identity_operator.py
          tests/test_physical_boot_identity_binding.py
          tests/test_physical_recovery_operator.py
          tests/test_physical_recovery_readiness.py
          tests/test_temporary_boot_execution.py

      - name: Smoke pinned automatic AC2003 host bootstrap without phone I/O
        shell: pwsh
        run: |
          ./scripts/bootstrap_ac2003_first_test.ps1 -CandidateRoot "." -RuntimeRoot "build/bootstrap-smoke" -EvidenceRoot "build/bootstrap-evidence-smoke" -LockPath "tools/ac2003-bootstrap-lock.json" -DownloadOnly
          if ($LASTEXITCODE -ne 0) { throw "Automatic AC2003 host bootstrap smoke failed: $LASTEXITCODE" }
          $Runtime = Get-Content -Raw -Encoding UTF8 "build/bootstrap-smoke/bootstrap-runtime.json" | ConvertFrom-Json
          if ($Runtime.phone_interaction_performed -ne $false -or $Runtime.persistent_write_authorized -ne $false -or $Runtime.beta_gate_credit -ne $false) {
            throw "Automatic host bootstrap smoke produced unsafe metadata"
          }

      - name: Build frozen Windows GUI and CLI
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Build exact bundled OTA extractor and runtime closure
        shell: pwsh
        run: ./scripts/build_windows_operator_extractor.ps1 -OutputDir "dist/operator-tools"

      - name: Smoke-test exact frozen AC2003 operator surface and bundled extractor
        shell: pwsh
        run: ./scripts/smoke_windows_beta_test_candidate.ps1 -CandidateRoot "dist"

      - name: Package, host-preflight, read-only baseline launcher and self-verify integrated AC2003 host test candidate
        shell: pwsh
        run: >-
          ./scripts/package_windows_beta_test_candidate.ps1
          -SourceCommit "${{ github.event.pull_request.head.sha || github.sha }}"
          -DistRoot "dist"

      - name: Smoke read-only stock Android identity capture without a phone
        shell: pwsh
        run: |
          $Policy = Get-Content -Raw -Encoding UTF8 "dist/operator-pack/fastboot-tool-policy.json" | ConvertFrom-Json
          $Scratch = Join-Path $env:RUNNER_TEMP ("kps-adb-identity-smoke-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $Scratch | Out-Null
          try {
            $FakeAdb = Join-Path $Scratch "adb.ps1"
            @'
          param([Parameter(ValueFromRemainingArguments = $true)][string[]]$Remaining)
          if ($Remaining.Count -eq 1 -and $Remaining[0] -eq "--version") {
              # Reproduce the native Windows adb.exe multiline CRLF output seen on the
              # real AC2003 host, including Google's numeric build suffix.
              Write-Output ("Android Debug Bridge version 1.0.41`r`nVersion __KPS_PLATFORM_TOOLS_VERSION__-15733141`r`nInstalled as C:\\kps\\platform-tools\\adb.exe`r`nRunning on Windows 10.0.26200")
              exit 0
          }
          if ($Remaining.Count -ge 1 -and $Remaining[0] -eq "devices") {
              Write-Output "List of devices attached"
              Write-Output "KPSADB0001 device product:avicii model:AC2003 device:avicii transport_id:1"
              exit 0
          }
          if ($Remaining.Count -eq 5 -and $Remaining[0] -eq "-s" -and $Remaining[1] -eq "KPSADB0001" -and $Remaining[2] -eq "shell" -and $Remaining[3] -eq "getprop") {
              switch ($Remaining[4]) {
                  "ro.product.device" { Write-Output "avicii"; exit 0 }
                  "ro.product.model" { Write-Output "AC2003"; exit 0 }
                  "ro.product.board" { Write-Output "lito"; exit 0 }
                  "ro.build.fingerprint" { Write-Output "OnePlus/avicii/avicii:12/RKQ1/KPS:user/release-keys"; exit 0 }
                  "ro.build.version.ota" { Write-Output "AC2003_11_F.99_KPS"; exit 0 }
                  "ro.build.display.id" { Write-Output "AC2003_11_F.99_KPS"; exit 0 }
                  "ro.build.id" { Write-Output "RKQ1"; exit 0 }
                  "ro.build.version.incremental" { Write-Output "KPS"; exit 0 }
                  "ro.boot.slot_suffix" { Write-Output "_a"; exit 0 }
                  "ro.boot.bootloader" { Write-Output "KPS-BOOT"; exit 0 }
                  "gsm.version.baseband" { Write-Output "KPS-BASEBAND"; exit 0 }
              }
          }
          Write-Error "Unexpected fake ADB invocation: $($Remaining -join ' ')"
          exit 19
          '@.Replace("__KPS_PLATFORM_TOOLS_VERSION__", [string]$Policy.platform_tools_version) | Set-Content -Encoding UTF8 $FakeAdb

            $Evidence = Join-Path $Scratch "stock-android-identity.json"
            & pwsh -NoProfile -File "dist/operator-pack/readonly-baseline.ps1" `
              -CandidateRoot "dist" `
              -AdbExecutable $FakeAdb `
              -AndroidIdentityEvidence $Evidence `
              -CaptureAndroidIdentityOnly
            if ($LASTEXITCODE -ne 0) { throw "Stock Android identity capture smoke failed: $LASTEXITCODE" }

            $Record = Get-Content -Raw -Encoding UTF8 $Evidence | ConvertFrom-Json
            if ($Record.profile_id -ne "oneplus/avicii") { throw "Stock Android identity smoke profile drift" }
            if ($Record.product_strong_match -ne $true -or $Record.model_strong_match -ne $true) { throw "Stock Android identity smoke strong-match failure" }
            if ($Record.firmware_build -ne "AC2003_11_F.99_KPS") { throw "Stock Android identity smoke firmware build drift" }
            if ($Record.adb_version_line -ne "Version $($Policy.platform_tools_version)-15733141") { throw "Stock Android identity smoke ADB Version-line parser drift" }
            if ($Record.read_only_stock_android_capture -ne $true -or $Record.adb_reboot_performed -ne $false) { throw "Stock Android identity smoke read-only policy failure" }
            if ($Record.persistent_write_authorized -ne $false -or $Record.phone_storage_written -ne $false -or $Record.beta_gate_credit -ne $false) { throw "Stock Android identity smoke unsafe promotion" }
          }
          finally {
            Remove-Item -LiteralPath $Scratch -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload unsigned integrated AC2003 Beta test candidate
        uses: actions/upload-artifact@v4
        with:
          name: KaliPhoneStudio-AC2003-beta-test-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/KaliPhoneStudio-AC2003-beta-test-candidate.zip
            dist/KaliPhoneStudio-AC2003-beta-test-candidate.zip.sha256
            dist/BETA_TEST_CANDIDATE_INFO.json
