name: physical-release-gate-audit

on:
  push:
    branches: [main]
    paths:
      - "kaliphonestudio/physical_release_gate_audit.py"
      - "kaliphonestudio/physical_bringup_dossier.py"
      - "kaliphonestudio/physical_bringup_dossier_verify.py"
      - "kaliphonestudio/physical_bringup_dossier_review.py"
      - "kaliphonestudio/physical_hardware_result_bundle.py"
      - "kaliphonestudio/physical_hardware_test_plan.py"
      - "kaliphonestudio/physical_hardware_test_plan_review.py"
      - "scripts/build_physical_release_gate_audit.py"
      - "tests/test_physical_release_gate_audit.py"
      - "docs/PHYSICAL_RELEASE_GATE_AUDIT.md"
      - ".github/workflows/physical-release-gate-audit.yml"
  pull_request:
    paths:
      - "kaliphonestudio/physical_release_gate_audit.py"
      - "kaliphonestudio/physical_bringup_dossier.py"
      - "kaliphonestudio/physical_bringup_dossier_verify.py"
      - "kaliphonestudio/physical_bringup_dossier_review.py"
      - "kaliphonestudio/physical_hardware_result_bundle.py"
      - "kaliphonestudio/physical_hardware_test_plan.py"
      - "kaliphonestudio/physical_hardware_test_plan_review.py"
      - "scripts/build_physical_release_gate_audit.py"
      - "tests/test_physical_release_gate_audit.py"
      - "docs/PHYSICAL_RELEASE_GATE_AUDIT.md"
      - ".github/workflows/physical-release-gate-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install pytest
      - name: Compile cross-campaign release-gate audit sources
        run: >-
          python -m py_compile
          kaliphonestudio/physical_release_gate_audit.py
          scripts/build_physical_release_gate_audit.py
          tests/test_physical_release_gate_audit.py
      - name: Run fail-closed cross-campaign release-gate audit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_physical_release_gate_audit.py
