name: physical-dossier-verify

on:
  push:
    branches: [main]
    paths:
      - "kaliphonestudio/physical_bringup_dossier.py"
      - "kaliphonestudio/physical_bringup_dossier_verify.py"
      - "scripts/verify_physical_bringup_dossier.py"
      - "tests/test_physical_bringup_dossier_verify.py"
      - ".github/workflows/physical-dossier-verify.yml"
  pull_request:
    paths:
      - "kaliphonestudio/physical_bringup_dossier.py"
      - "kaliphonestudio/physical_bringup_dossier_verify.py"
      - "scripts/verify_physical_bringup_dossier.py"
      - "tests/test_physical_bringup_dossier_verify.py"
      - ".github/workflows/physical-dossier-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install pytest
      - name: Compile dossier reverification sources
        run: >-
          python -m py_compile
          kaliphonestudio/physical_bringup_dossier.py
          kaliphonestudio/physical_bringup_dossier_verify.py
          scripts/verify_physical_bringup_dossier.py
          tests/test_physical_bringup_dossier_verify.py
      - name: Run exact-file post-copy contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_physical_bringup_dossier_verify.py
