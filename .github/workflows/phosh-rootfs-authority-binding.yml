name: phosh-rootfs-authority-binding

on:
  push:
    branches: [main]
    paths:
      - "kaliphonestudio/phosh.py"
      - "kaliphonestudio/phosh_rootfs_binding.py"
      - "kaliphonestudio/phosh_candidate_binding.py"
      - "kaliphonestudio/rootfs_authority.py"
      - "kaliphonestudio/candidate_authority_bundle.py"
      - "scripts/build_phosh_rootfs_authority_binding.py"
      - "scripts/build_phosh_candidate_binding.py"
      - "tests/test_phosh.py"
      - "tests/test_phosh_rootfs_binding.py"
      - "tests/test_phosh_candidate_binding.py"
      - "tools/phosh-source-lock.json"
      - "docs/PHOSH_ROOTFS_CONTRACT.md"
      - "docs/PHOSH_ROOTFS_AUTHORITY_BINDING.md"
      - "docs/PHOSH_CANDIDATE_BINDING.md"
      - "BUILD_STATUS.json"
      - "ROADMAP.md"
      - "CHANGELOG.md"
      - ".github/workflows/phosh-rootfs-authority-binding.yml"
  pull_request:
    paths:
      - "kaliphonestudio/phosh.py"
      - "kaliphonestudio/phosh_rootfs_binding.py"
      - "kaliphonestudio/phosh_candidate_binding.py"
      - "kaliphonestudio/rootfs_authority.py"
      - "kaliphonestudio/candidate_authority_bundle.py"
      - "scripts/build_phosh_rootfs_authority_binding.py"
      - "scripts/build_phosh_candidate_binding.py"
      - "tests/test_phosh.py"
      - "tests/test_phosh_rootfs_binding.py"
      - "tests/test_phosh_candidate_binding.py"
      - "tools/phosh-source-lock.json"
      - "docs/PHOSH_ROOTFS_CONTRACT.md"
      - "docs/PHOSH_ROOTFS_AUTHORITY_BINDING.md"
      - "docs/PHOSH_CANDIDATE_BINDING.md"
      - "BUILD_STATUS.json"
      - "ROADMAP.md"
      - "CHANGELOG.md"
      - ".github/workflows/phosh-rootfs-authority-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-contract:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Compile Phosh authority and candidate bindings
        run: >-
          python -m py_compile
          kaliphonestudio/phosh.py
          kaliphonestudio/phosh_rootfs_binding.py
          kaliphonestudio/phosh_candidate_binding.py
          kaliphonestudio/rootfs_authority.py
          kaliphonestudio/candidate_authority_bundle.py
          scripts/build_phosh_rootfs_authority_binding.py
          scripts/build_phosh_candidate_binding.py
          tests/test_phosh_rootfs_binding.py
          tests/test_phosh_candidate_binding.py
      - name: Run Phosh binding and source-contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_phosh.py
          tests/test_phosh_rootfs_binding.py
          tests/test_phosh_candidate_binding.py
      - name: Re-run progress and repository presentation contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_progress_svgs.py
          tests/test_progress_presentation_policy.py
          tests/test_repository_contract.py
