name: current-physical-observation-rescue-gate

on:
  push:
    branches: [main]
    paths:
      - "kaliphonestudio/physical_boot_observation.py"
      - "kaliphonestudio/physical_rescue_diagnostics.py"
      - "kaliphonestudio/physical_rescue_functional_probes.py"
      - "kaliphonestudio/physical_hardware_survey.py"
      - "scripts/record_physical_rescue_diagnostics.py"
      - "tests/test_current_physical_observation_rescue_gate.py"
      - "tests/test_physical_boot_observation.py"
      - "tests/test_physical_rescue_diagnostics.py"
      - "tests/test_physical_rescue_functional_probes.py"
      - "tests/test_physical_hardware_survey.py"
      - ".github/workflows/current-physical-observation-rescue-gate.yml"
  pull_request:
    paths:
      - "kaliphonestudio/physical_boot_observation.py"
      - "kaliphonestudio/physical_rescue_diagnostics.py"
      - "kaliphonestudio/physical_rescue_functional_probes.py"
      - "kaliphonestudio/physical_hardware_survey.py"
      - "scripts/record_physical_rescue_diagnostics.py"
      - "tests/test_current_physical_observation_rescue_gate.py"
      - "tests/test_physical_boot_observation.py"
      - "tests/test_physical_rescue_diagnostics.py"
      - "tests/test_physical_rescue_functional_probes.py"
      - "tests/test_physical_hardware_survey.py"
      - ".github/workflows/current-physical-observation-rescue-gate.yml"

permissions:
  contents: read

jobs:
  rescue-admission-gate:
    name: rescue chain admission / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Focused fail-closed regression tests
        run: >-
          python -m pytest -q
          tests/test_current_physical_observation_rescue_gate.py
          tests/test_physical_boot_observation.py
          tests/test_physical_rescue_diagnostics.py
          tests/test_physical_rescue_functional_probes.py
          tests/test_physical_hardware_survey.py
      - name: Compile changed safety modules
        run: >-
          python -m compileall -q
          kaliphonestudio/physical_boot_observation.py
          kaliphonestudio/physical_rescue_diagnostics.py
          kaliphonestudio/physical_rescue_functional_probes.py
          kaliphonestudio/physical_hardware_survey.py
          scripts/record_physical_rescue_diagnostics.py
      - name: Safety surface guard
        shell: python
        run: |
          from pathlib import Path

          sources = {
              "rescue diagnostics": Path("kaliphonestudio/physical_rescue_diagnostics.py").read_text(encoding="utf-8"),
              "functional probes": Path("kaliphonestudio/physical_rescue_functional_probes.py").read_text(encoding="utf-8"),
              "hardware survey": Path("kaliphonestudio/physical_hardware_survey.py").read_text(encoding="utf-8"),
          }
          required_diagnostics = (
              "requires schema-v2 physical boot observation",
              "require_current_physical_boot_observation_for_rescue",
          )
          missing = [item for item in required_diagnostics if item not in sources["rescue diagnostics"]]
          if missing:
              raise SystemExit(f"missing rescue admission guard markers: {missing}")
          for label in ("functional probes", "hardware survey"):
              if "require_current_physical_boot_observation_for_rescue" not in sources[label]:
                  raise SystemExit(f"{label} is not gated by the current physical observation contract")
          forbidden = ("subprocess.", " fastboot ", " adb ", "set_active", "erase ", "flash ")
          for label, source in sources.items():
              lowered = source.lower()
              hits = [item for item in forbidden if item.lower() in lowered]
              if hits:
                  raise SystemExit(f"offline {label} acquired forbidden device-I/O surface: {hits}")
          print("current physical observation rescue/functional/survey admission gate: PASS")
